<!doctype html>
<html lang="ru">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} — демонстрация</title>
<style>
body {font:16px system-ui; margin:16px; color:#242138; background:#f5f4fb}
button {padding:12px; cursor:pointer} h2 {font-size:20px}
</style>
<h2>{{ title }}</h2>
<p>Демонстрационный клиент, загруженный с backend. Реальных данных нет.</p>
<button id="action">Проверить действие сервиса</button>
<p id="reply" role="status">Ожидаем ядро…</p>
<script>
const channel = new URLSearchParams(location.hash.slice(1)).get('channel');
// Origin ядра передаётся сервером, а не берётся из произвольного сообщения.
const coreOrigin = {{ core_origin|tojson }};
const send = (type) => parent.postMessage({type, channel}, coreOrigin);
window.addEventListener('message', (event) => {
  if (event.source !== parent || event.origin !== coreOrigin ||
      event.data?.channel !== channel || event.data.type !== 'core:ping') return;
  document.getElementById('reply').textContent = 'Связь с ядром работает';
  send('service:pong');
});
document.getElementById('action').addEventListener('click', () => send('service:action'));
send('service:ready');
</script>
</html>
