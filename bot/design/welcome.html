<!doctype html>
<!--
  Макет приветственной картинки бота (bot/assets/welcome.png), 1280×960.
  Минимализм: однородный фон и цвет текста из frontend/src/styles/global.css, логотип, название.
  logo@3x.png — логотип frontend/src/assets/logo-buildings.png, увеличенный в 3 раза с резкими краями.
  Пересобрать (из корня репозитория, нужен frontend/node_modules):
    chromium --headless=new --disable-gpu --hide-scrollbars --allow-file-access-from-files \
      --window-size=1280,1048 --screenshot=raw.png "file://$PWD/bot/design/welcome.html"
  Окно выше на 88 px: headless вычитает их из высоты. Затем обрезать до 1280×960:
    python3 -c "from PIL import Image; Image.open('raw.png').crop((0,0,1280,960)).save('bot/assets/welcome.png')"
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Unbounded; font-weight: 500;
    src: url(../../frontend/node_modules/@fontsource/unbounded/files/unbounded-cyrillic-500-normal.woff2) format('woff2'),
         url(../../frontend/node_modules/@fontsource/unbounded/files/unbounded-latin-500-normal.woff2) format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 960px; overflow: hidden; }
  body { background: #F6F7FB; color: #111827; display: grid; place-content: center; justify-items: center;
         -webkit-font-smoothing: antialiased; }
  img { width: 560px; height: auto; display: block; }
  h1 { font-family: Unbounded, sans-serif; font-weight: 500; font-size: 88px; line-height: 1;
       letter-spacing: -.01em; margin-top: 64px; }
</style>
</head>
<body>
  <img src="logo@3x.png" alt="">
  <h1>Вузы России</h1>
</body>
</html>
