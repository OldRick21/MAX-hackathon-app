# Курсовые — отдельный сервис вуза. Поднимается независимо от платформы, все настройки — в coursework.env:
#   cd test-data/coursework && cp coursework.env.example coursework.env && nano coursework.env
#   docker compose --env-file coursework.env up -d --build
# С платформой общается только по HTTPS через CORE_URL и ключ из пульта. Сертификаты — свои, в ./letsencrypt.
name: coursework

services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: coursework.env
    environment:
      SERVICE_DATA: /data
    volumes:
      - coursework-data:/data

  # HTTPS-вход на DNS-имени, одобренном в пульте оператора.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${COURSEWORK_PORT:?Run compose with --env-file coursework.env}:443"
    environment:
      COURSEWORK_HOST: ${COURSEWORK_HOST:?Run compose with --env-file coursework.env}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./letsencrypt:/etc/letsencrypt:ro

  # Выпуск и продление сертификата сервиса; хранится только в ./letsencrypt.
  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ${ACME_WEBROOT:-/var/lib/max-miniapp/acme}:/var/www/acme

volumes:
  coursework-data:
