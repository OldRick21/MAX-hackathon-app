openapi: 3.1.1
info:
  title: Вузы России — API ядра-бекенда
  version: 0.1.0
  description: 'Предложенный контракт MVP от 2026-09-24. Не описание текущей реализации. Только операции ядра, включая
    API, вызываемое backend сервисов. Доменные API других компонентов не входят. CORE_API_SPEC.md дополняет HTTP-контракт
    правилами JWT, изоляции, транзакций и bootstrap. Private операции имеют отдельный server и AND-требование machine
    + actor; на публичном ingress всегда 404. x-required-permission, x-required-machine-scope и x-network-access
    — документационные extensions, не автоматическое обеспечение доступа. Форматы JSON: snake_case, UUID string,
    UTC. Формат документа — OpenAPI 3.1.1 (https://spec.openapis.org/oas/v3.1.1.html).'
servers:
- url: https://core.example
  description: Публичный HTTPS origin ядра; заменить при развёртывании.
security:
- CoreBearer: []
tags:
- name: Health
- name: Auth
- name: Institutions
- name: Services
- name: Service sessions
- name: Service auth
- name: Service registry
- name: Service RBAC
- name: Private administration
- name: Private members
- name: Private services
- name: Private roles
- name: Private credentials
- name: Shell
paths:
  /api/v1/health:
    get:
      tags:
      - Health
      summary: Проверить живость процесса ядра
      operationId: getHealth
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/Error500'
      description: Только liveness, не проверяет БД, сервисы или готовность login.
      security: []
  /api/v1/auth/token:
    post:
      tags:
      - Auth
      summary: Войти через MAX, зарегистрировать аккаунт при первом входе
      operationId: loginWithMax
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTokenPair'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      description: HMAC и структура initData проверяются ядром; возраст до 300 с, future skew до 30 с. Повтор создаёт
        новую сессию, но не аккаунт. Вуз/профили автоматически не назначаются.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Ротировать пару токенов ядра
      operationId: refreshCoreSession
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTokenPair'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      description: Аутентификация core_refresh из тела и живой записью сессии; access не требуется. Старый refresh
        потребляется атомарно. Повтор использованного токена отзывает семью и дочерние service sessions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Отозвать текущую сессию ядра и дочерние сессии
      operationId: logoutCoreSession
      responses:
        '204':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/Error400'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      description: Принимает core refresh из тела. 204 также для неизвестного, истёкшего или уже отозванного токена.
        Остальные login-сессии не затрагивает. Offline access сервиса живёт до 300 с + skew.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Получить свою учётную запись платформы
      operationId: getCurrentUser
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      description: Не образовательная анкета. UUID можно сообщить администратору для добавления в вуз.
  /api/v1/institution:
    get:
      tags:
      - Institutions
      summary: Получить свои вузы и назначенные профили
      operationId: listMyInstitutions
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      description: Только членства текущего пользователя. Пустой результат — 200; видны pending/active/suspended
        со статусом. Не глобальный каталог.
      parameters:
      - $ref: '#/components/parameters/LocaleQuery'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
  /api/v1/institution/{institution_id}:
    parameters:
    - $ref: '#/components/parameters/institution_id'
    get:
      tags:
      - Institutions
      summary: Получить доступный вуз
      operationId: getMyInstitution
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionView'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
      - $ref: '#/components/parameters/LocaleQuery'
  /api/v1/institution/{institution_id}/profiles:
    parameters:
    - $ref: '#/components/parameters/institution_id'
    get:
      tags:
      - Institutions
      summary: Получить свои профили в вузе
      operationId: listMyProfiles
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileList'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
  /api/v1/institution/{institution_id}/service:
    parameters:
    - $ref: '#/components/parameters/institution_id'
    get:
      tags:
      - Services
      summary: Получить сервисы и меню для выбранного профиля
      operationId: listMyServices
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      description: Только включённые экземпляры активного вуза с хотя бы одним доступным меню. Меню отфильтрованы
        по профилю и всем required_permissions.
      parameters:
      - $ref: '#/components/parameters/ProfileQuery'
      - $ref: '#/components/parameters/LocaleQuery'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
  /api/v1/institution/{institution_id}/service/{service_id}:
    parameters:
    - $ref: '#/components/parameters/institution_id'
    - $ref: '#/components/parameters/service_id'
    get:
      tags:
      - Services
      summary: Получить карточку экземпляра и адреса клиентов
      operationId: getMyService
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceView'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      description: service_id принадлежит institution_id. Только меню выбранного профиля. Неподдерживаемый сервисом
        профиль — 404, отсутствующий у пользователя профиль — 403, выключенный экземпляр — 409.
      parameters:
      - $ref: '#/components/parameters/ProfileQuery'
      - $ref: '#/components/parameters/LocaleQuery'
  /api/v1/institution/{institution_id}/service/{service_id}/session:
    parameters:
    - $ref: '#/components/parameters/institution_id'
    - $ref: '#/components/parameters/service_id'
    post:
      tags:
      - Service sessions
      summary: Выдать пару JWT для одного экземпляра и профиля
      operationId: createServiceSession
      responses:
        '201':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTokenPair'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      description: Ядро подписывает оба JWT. access разрешено передать iframe, refresh остаётся в памяти shell.
        Location указывает .../session/{session_id}; GET для этой ссылки не предусмотрен, доступен DELETE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceSession'
  /api/v1/institution/{institution_id}/service/{service_id}/session/refresh:
    parameters:
    - $ref: '#/components/parameters/institution_id'
    - $ref: '#/components/parameters/service_id'
    post:
      tags:
      - Service sessions
      summary: Ротировать пару JWT сервиса
      operationId: refreshServiceSession
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTokenPair'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      description: Аутентификация service_refresh из тела. Проверяется также активность parent_sid; core access
        не требуется. Пути обязаны совпасть с claims. Профиль неизменен; roles/permissions вычисляются заново.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /api/v1/institution/{institution_id}/service/{service_id}/session/{session_id}:
    parameters:
    - $ref: '#/components/parameters/institution_id'
    - $ref: '#/components/parameters/service_id'
    - $ref: '#/components/parameters/session_id'
    delete:
      tags:
      - Service sessions
      summary: Отозвать дочернюю сессию текущего core login
      operationId: revokeServiceSession
      responses:
        '204':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      description: CoreBearer должен принадлежать parent_sid удаляемой сессии и пользователю. Уже отозванная известная
        своя сессия — 204; чужая/неизвестная — 404. Offline JWT может жить до expiry.
  /api/v1/internal/auth/token:
    post:
      tags:
      - Service auth
      summary: Обменять credential экземпляра на machine JWT
      operationId: issueMachineToken
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineToken'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      description: Basic username=client_id, password=client_secret. Токен на 300 с без refresh. Scope фиксирован
        платформой. Disabled instance разрешён для onboarding, pending/suspended вуз — 409.
      security:
      - ServiceBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachineTokenRequest'
  /api/v1/internal/auth/jwks:
    get:
      tags:
      - Service auth
      summary: Получить публичные ключи access JWT
      operationId: getAccessJwks
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              description: Кэш публичного набора ключей.
              schema:
                type: string
                const: public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      description: Публичный endpoint. Публикует все ещё действующие access-ключи для ротации, без секретов и ключей
        refresh.
      security: []
  /api/v1/internal/auth/introspect:
    post:
      tags:
      - Service auth
      summary: Проверить живость service access и актуальные права
      operationId: introspectServiceAccess
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectionResult'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      description: 'Machine субъект проверяет только JWT своего экземпляра. Чужой, истёкший, отозванный, неверного
        типа JWT — 200 active:false. Нет positive cache. При отказе БД — 503, не active:true. Требуемый machine
        scope: tokens:introspect.'
      security:
      - MachineBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntrospectionRequest'
      x-required-machine-scope: tokens:introspect
  /api/v1/internal/service/{service_id}/manifest:
    parameters:
    - $ref: '#/components/parameters/service_id'
    get:
      tags:
      - Service registry
      summary: Прочитать зарегистрированный manifest своего экземпляра
      operationId: getOwnManifest
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceManifest'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      security:
      - MachineBearer: []
      x-required-machine-scope: manifest:write
      description: ' Требуемый machine scope: manifest:write.'
    put:
      tags:
      - Service registry
      summary: Заменить имя и меню своего экземпляра
      operationId: replaceOwnManifest
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceManifest'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
