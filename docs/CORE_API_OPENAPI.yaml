      description: 'Public ingress всегда отвечает 404 до аутентификации. На private listener обязательны оба токена,
        совпадение вуза/экземпляра администрации и свежие права actor. Без тела запроса. Секрет выдаётся только
        здесь и один раз. Не более двух активных credentials; превышение — 409 CREDENTIAL_LIMIT. Не автоматически
        отзывает старый. Для cloud — 403. Требуемый permission actor: credentials.manage.'
      servers:
      - url: https://core.private.example
        description: Приватный listener; доступ только workload администрирования.
      security:
      - MachineBearer: []
        ActorToken: []
      x-network-access: private-administration-only
      x-required-permission: credentials.manage
  /api/v1/institution/{institution_id}/internal/services/{service_id}/credentials/{credential_id}:
    parameters:
    - $ref: '#/components/parameters/institution_id'
    - $ref: '#/components/parameters/service_id'
    - $ref: '#/components/parameters/credential_id'
    delete:
      tags:
      - Private credentials
      summary: Отозвать локальный credential и его machine JWT
      operationId: revokeLocalServiceCredential
      responses:
        '204':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      description: 'Public ingress всегда отвечает 404 до аутентификации. На private listener обязательны оба токена,
        совпадение вуза/экземпляра администрации и свежие права actor. Монотонный отзыв, If-Match не нужен. Уже
        отозванный свой — 204; чужой/неизвестный — 404. Для cloud — 403. Пользовательские сессии сохраняются. Требуемый
        permission actor: credentials.manage.'
      servers:
      - url: https://core.private.example
        description: Приватный listener; доступ только workload администрирования.
      security:
      - MachineBearer: []
        ActorToken: []
      x-network-access: private-administration-only
      x-required-permission: credentials.manage
  /institution:
    get:
      tags:
      - Shell
      summary: Отдать HTML ядра-клиента
      operationId: getInstitutionShell
      responses:
        '200':
          description: HTML shell.
          content:
            text/html:
              schema:
                type: string
        '503':
          description: HTML оболочка временно недоступна.
      description: Публичная оболочка без персональных данных и JWT. Авторизация и redirect при одном вузе выполняются
        shell после JSON login. Не читает bearer из URL.
      security: []
  /institution/{institution_id}:
    parameters:
    - $ref: '#/components/parameters/institution_id'
    get:
      tags:
      - Shell
      summary: Отдать HTML ядра-клиента
      operationId: getInstitutionWorkspaceShell
      responses:
        '200':
          description: HTML shell.
          content:
            text/html:
              schema:
                type: string
        '503':
          description: HTML оболочка временно недоступна.
        '404':
          description: Некорректный UUID пути; данные/членство проверяются отдельно через JSON API.
      description: Публичная оболочка без персональных данных и JWT. Авторизация и redirect при одном вузе выполняются
        shell после JSON login. Не читает bearer из URL.
      security: []
components:
  securitySchemes:
    CoreBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Пользовательский token_use=core_access, aud=core-api; живая sid обязательна.
    MachineBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: token_use=machine_access, aud=core-internal. Credential и tenant проверяются на каждом запросе.
        Не пользовательский токен.
    ServiceBasic:
      type: http
      scheme: basic
      description: 'Только HTTPS token exchange: client_id как username, client_secret как password.'
    ActorToken:
      type: apiKey
      in: header
      name: X-Actor-Token
      description: 'JWT без префикса Bearer: service_access человека для экземпляра administration, профиль admin.
        AND с MachineBearer; актуальный RBAC из БД.'
  parameters:
    institution_id:
      name: institution_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    service_id:
      name: service_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    user_id:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    session_id:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    credential_id:
      name: credential_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    role_code:
      name: role_code
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Code'
    profile_path:
      name: profile
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Profile'
    ProfileQuery:
      name: profile
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Profile'
      description: Явно выбранный профиль; он должен быть назначен текущему пользователю в этом вузе.
    LocaleQuery:
      name: locale
      in: query
      schema:
        $ref: '#/components/schemas/Locale'
      description: ru по умолчанию. Нет перевода en — fallback ru отдельно для каждой строки.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: Непрозрачный keyset cursor на 15 минут; связан с actor, фильтрами и областью доступа.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 128
        pattern: ^"[^"\\]+"$
      description: Ровно один strong ETag текущего ресурса. Нет заголовка — 428; несовпадение — 412. * запрещён.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
      description: Повтор создания с тем же ключом/телом в течение 24 ч возвращает прежний результат. Иное тело
        — 409.
  headers:
    RequestId:
      description: UUID запроса, назначенный ядром.
      schema:
        $ref: '#/components/schemas/UUID'
    NoStore:
      description: Ответ нельзя сохранять в HTTP-кэше.
      schema:
        type: string
        const: no-store
    ETag:
      description: Strong ETag ресурса для If-Match.
      schema:
        type: string
        examples:
        - '"rev-7"'
    Location:
      description: Относительный URI созданного ресурса ядра.
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Число секунд до следующей попытки.
      schema:
        type: integer
        minimum: 1
    Authenticate:
      description: Basic на machine token exchange; Bearer на access-защищённых маршрутах. На body-refresh может
        отсутствовать.
      schema:
        type: string
        examples:
        - Bearer
        - Basic realm="core-service"
  responses:
    Error400:
      description: Невалидный JSON, cursor или синтаксис запроса.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error401:
      description: Аутентификация отсутствует или недействительна; invalid_init_data/refresh/client также дают 401.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        WWW-Authenticate:
          $ref: '#/components/headers/Authenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: Не хватает профиля, scope или актуального permission; защищённая операция запрещена.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: Ресурс не существует либо находится вне области доступа. Public private-prefix всегда 404.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error409:
      description: Конфликт состояния, защищённого инварианта, уникальности или Idempotency-Key.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error412:
      description: Переданный If-Match больше не соответствует версии ресурса.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error422:
      description: Ошибка схемы или доменной валидации; см. error.details.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error428:
      description: Обязательный If-Match отсутствует.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error429:
      description: Превышен лимит запросов.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error503:
      description: Необходимое хранилище или конфигурация недоступны. Повтор не означает гарантированный успех.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error500:
      description: Внутренняя ошибка без раскрытия реализации.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    UUID:
      type: string
      format: uuid
      examples:
      - 46bf3278-29fa-4d0a-a711-e4a6a324ed31
    DateTime:
      type: string
      format: date-time
      description: RFC 3339 UTC, суффикс Z.
    Locale:
      type: string
      enum:
      - ru
      - en
      default: ru
    Profile:
      type: string
      enum:
      - admin
      - teacher
      - student
    Profiles:
      type: array
      items:
        $ref: '#/components/schemas/Profile'
      minItems: 1
      maxItems: 3
      uniqueItems: true
    Code:
      type: string
      pattern: ^[a-z][a-z0-9_.-]{0,63}$
      maxLength: 64
    ServiceTypeCode:
      type: string
      enum:
      - administration
      - schedule
      - user-profile
      - coursework
    Deployment:
      type: string
      enum:
      - cloud
      - local
    LocalizedText:
      type: object
      additionalProperties: false
      required:
      - ru
      properties:
        ru:
          type: string
          minLength: 1
          maxLength: 200
        en:
          type: string
          minLength: 1
          maxLength: 200
      description: Переводы для MVP. ru обязателен и служит fallback.
      examples:
      - ru: Расписание
        en: Schedule
    Permissions:
      type: array
      items:
        $ref: '#/components/schemas/Code'
      maxItems: 128
      uniqueItems: true
      description: Коды из неизменяемого платформой словаря соответствующего типа сервиса.
    RoleCodes:
      type: array
      items:
        $ref: '#/components/schemas/Code'
      maxItems: 32
      uniqueItems: true
    JWT:
      type: string
      minLength: 1
      maxLength: 16384
      description: Подписанный JWT. Назначение определяется endpoint и проверенными token_use/aud, см. CORE_API_SPEC.md.
    HttpsApiUrl:
      type: string
      format: uri
      pattern: ^https://[^/?#@]+(?:/[^?#]*)?$
      maxLength: 2048
      description: HTTPS URL, разрешённый платформой. Может иметь path-prefix. Дополнительные проверки hostname
        и allowlist — в спецификации.
    HttpsOrigin:
      type: string
      format: uri
      pattern: ^https://[^/?#@]+$
      maxLength: 2048
      description: Только origin, без завершающего / и пути. DNS hostname должен быть одобрен оператором.
    EntrypointPath:
      type: string
      pattern: ^/(?!/)[A-Za-z0-9_./-]*$
      maxLength: 1024
      description: Путь внутри client origin. Дополнительно запрещены сегменты . и ..; URL-encoding, query, fragment
        и backslash не поддерживаются.
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - max_user_id
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        max_user_id:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 32
        created_at:
          $ref: '#/components/schemas/DateTime'
      examples:
      - id: a76e24db-05e7-4cde-8a60-fbe3b5e5dd42
        max_user_id: '123456789'
        created_at: '2026-09-24T10:00:00Z'
    AuthTokenRequest:
      type: object
      additionalProperties: false
      required:
      - initData
      properties:
        initData:
          type: string
          minLength: 1
          maxLength: 16384
          description: Сырая неизменённая строка WebApp.initData; декодирование и HMAC выполняет ядро.
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
      - refresh_token
      properties:
        refresh_token:
          $ref: '#/components/schemas/JWT'
    CoreTokenPair:
      type: object
      additionalProperties: false
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - refresh_expires_in
      - session_id
      properties:
        access_token:
          $ref: '#/components/schemas/JWT'
        refresh_token:
          $ref: '#/components/schemas/JWT'
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          maximum: 600
        refresh_expires_in:
          type: integer
          minimum: 1
          maximum: 604800
        session_id:
          $ref: '#/components/schemas/UUID'
    CreateServiceSession:
      type: object
      additionalProperties: false
      required:
      - profile
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
      examples:
      - profile: student
    ServiceTokenPair:
      type: object
      additionalProperties: false
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - refresh_expires_in
      - session_id
      - parent_session_id
      - institution_id
      - service_id
      - profile
      properties:
        access_token:
          $ref: '#/components/schemas/JWT'
        refresh_token:
          $ref: '#/components/schemas/JWT'
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          maximum: 300
        refresh_expires_in:
          type: integer
          minimum: 1
          maximum: 86400
        session_id:
          $ref: '#/components/schemas/UUID'
        parent_session_id:
          $ref: '#/components/schemas/UUID'
        institution_id:
          $ref: '#/components/schemas/UUID'
        service_id:
          $ref: '#/components/schemas/UUID'
        profile:
          $ref: '#/components/schemas/Profile'
    InstitutionStatus:
      type: string
      enum:
      - pending
      - active
      - suspended
    InstitutionView:
      type: object
      additionalProperties: false
      required:
      - id
      - display_name
      - locale
      - default_locale
      - status
      - profiles
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        locale:
          $ref: '#/components/schemas/Locale'
        default_locale:
          $ref: '#/components/schemas/Locale'
        status:
          $ref: '#/components/schemas/InstitutionStatus'
        profiles:
          $ref: '#/components/schemas/Profiles'
      examples:
      - id: 46bf3278-29fa-4d0a-a711-e4a6a324ed31
        display_name: Демонстрационный университет
        locale: ru
        default_locale: ru
        status: active
        profiles:
        - student
        - teacher
    InstitutionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InstitutionView'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
      examples:
      - items: []
        next_cursor: null
    ProfileList:
      type: object
      additionalProperties: false
      required:
      - user_id
      - institution_id
      - profiles
      properties:
        user_id:
          $ref: '#/components/schemas/UUID'
        institution_id:
          $ref: '#/components/schemas/UUID'
        profiles:
          $ref: '#/components/schemas/Profiles'
    MenuDefinition:
      type: object
      additionalProperties: false
      required:
      - id
      - titles
      - entrypoint_path
      - profiles
      - required_permissions
      - order
      properties:
        id:
          $ref: '#/components/schemas/Code'
        titles:
          $ref: '#/components/schemas/LocalizedText'
        entrypoint_path:
          $ref: '#/components/schemas/EntrypointPath'
        profiles:
          $ref: '#/components/schemas/Profiles'
        required_permissions:
          $ref: '#/components/schemas/Permissions'
        order:
          type: integer
          minimum: 0
          maximum: 10000
    MenuView:
      type: object
      additionalProperties: false
      required:
      - id
      - display_name
      - locale
      - entrypoint_path
      - order
      properties:
        id:
          $ref: '#/components/schemas/Code'
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        locale:
          $ref: '#/components/schemas/Locale'
        entrypoint_path:
          $ref: '#/components/schemas/EntrypointPath'
        order:
          type: integer
          minimum: 0
          maximum: 10000
    ServiceManifest:
      type: object
      additionalProperties: false
      required:
      - titles
      - menus
      properties:
        titles:
          $ref: '#/components/schemas/LocalizedText'
        menus:
          type: array
          items:
            $ref: '#/components/schemas/MenuDefinition'
          maxItems: 32
      description: ID меню уникальны внутри manifest. Профили и permissions проверяются по каталогу типа. Пустой
        manifest допустим до включения.
    ServiceView:
      type: object
      additionalProperties: false
      required:
      - id
      - institution_id
      - service_type
      - deployment
      - display_name
      - locale
      - api_base_url
      - client_base_url
      - profile
      - roles
      - permissions
      - menus
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        institution_id:
          $ref: '#/components/schemas/UUID'
        service_type:
          $ref: '#/components/schemas/ServiceTypeCode'
        deployment:
          $ref: '#/components/schemas/Deployment'
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        locale:
          $ref: '#/components/schemas/Locale'
        api_base_url:
          $ref: '#/components/schemas/HttpsApiUrl'
        client_base_url:
          $ref: '#/components/schemas/HttpsOrigin'
        profile:
          $ref: '#/components/schemas/Profile'
        roles:
          $ref: '#/components/schemas/RoleCodes'
        permissions:
          $ref: '#/components/schemas/Permissions'
        menus:
          type: array
          items:
            $ref: '#/components/schemas/MenuView'
          maxItems: 32
      description: Карточка в контексте текущего пользователя и выбранного профиля. Только разрешённые меню; секретов
        нет.
      examples:
      - id: b4c51283-fbdf-44a2-91e8-7f3d07f52e1a
        institution_id: 46bf3278-29fa-4d0a-a711-e4a6a324ed31
        service_type: user-profile
        deployment: cloud
        display_name: Профиль пользователя
        locale: ru
        api_base_url: https://profiles-api.platform.example/api/v1
        client_base_url: https://profiles-ui.platform.example
        profile: teacher
        roles: []
        permissions: []
        menus:
        - id: home
          display_name: Главная
          locale: ru
          entrypoint_path: /home
          order: 0
        - id: users
          display_name: Пользователи
          locale: ru
          entrypoint_path: /users
          order: 10
    ServicePage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceView'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
