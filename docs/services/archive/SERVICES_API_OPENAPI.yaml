      - service_type
      - deployment
      - display_name
      - locale
      - api_base_url
      - client_base_url
      - profile
      - roles
      - permissions
      - menus
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        institution_id:
          $ref: '#/components/schemas/UUID'
        service_type:
          $ref: '#/components/schemas/ServiceTypeCode'
        deployment:
          $ref: '#/components/schemas/Deployment'
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        locale:
          $ref: '#/components/schemas/Locale'
        api_base_url:
          $ref: '#/components/schemas/HttpsApiUrl'
        client_base_url:
          $ref: '#/components/schemas/HttpsOrigin'
        profile:
          $ref: '#/components/schemas/Profile'
        roles:
          $ref: '#/components/schemas/RoleCodes'
        permissions:
          $ref: '#/components/schemas/Permissions'
        menus:
          type: array
          items:
            $ref: '#/components/schemas/MenuView'
