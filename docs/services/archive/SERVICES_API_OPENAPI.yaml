      - decision
      - comment
      properties:
        decision:
          type: string
          enum:
          - accepted
          - changes_requested
        comment:
          type: string
          minLength: 0
          maxLength: 2000
      examples:
      - decision: changes_requested
        comment: Добавьте список источников.
    Review:
      type: object
      additionalProperties: false
      required:
      - decision
      - comment
      - reviewer_id
      - reviewed_at
      properties:
        decision:
          type: string
          enum:
          - accepted
          - changes_requested
        comment:
          type: string
          minLength: 0
          maxLength: 2000
        reviewer_id:
          $ref: '#/components/schemas/UUID'
        reviewed_at:
          $ref: '#/components/schemas/DateTime'
    FileInfo:
      type: object
      additionalProperties: false
      required:
      - original_name
      - size_bytes
      - media_type
      - sha256
      properties:
        original_name:
          type: string
          minLength: 1
          maxLength: 255
        size_bytes:
          type: integer
          minimum: 1
          maximum: 20971520
        media_type:
          type: string
          const: application/pdf
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    Submission:
      type: object
      additionalProperties: false
      required:
      - id
      - student_id
      - teacher_id
      - title
      - status
      - version
      - file
      - review
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        student_id:
          $ref: '#/components/schemas/UUID'
        teacher_id:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum:
          - submitted
          - accepted
          - changes_requested
        version:
          type: integer
          minimum: 1
        file:
          $ref: '#/components/schemas/FileInfo'
        review:
          oneOf:
          - $ref: '#/components/schemas/Review'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
    SubmissionUpload:
      type: object
      additionalProperties: false
      required:
      - title
      - teacher_id
      - file
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        teacher_id:
          $ref: '#/components/schemas/UUID'
        file:
          type: string
          format: binary
          description: Один непустой PDF, максимум 20 MiB. Поле содержит двоичные байты, не base64.
    SubmissionFileUpload:
      type: object
      additionalProperties: false
      required:
