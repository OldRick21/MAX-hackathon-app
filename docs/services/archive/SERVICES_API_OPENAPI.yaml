    ServiceTypeList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceType'
          minItems: 4
          maxItems: 4
    MembershipPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
    Membership:
      type: object
      additionalProperties: false
      required:
      - institution_id
      - user_id
      - profiles
      - created_at
      properties:
        institution_id:
          $ref: '#/components/schemas/UUID'
        user_id:
          $ref: '#/components/schemas/UUID'
        profiles:
          $ref: '#/components/schemas/Profiles'
        created_at:
          $ref: '#/components/schemas/DateTime'
    MembershipCreate:
      type: object
      additionalProperties: false
      required:
      - user_id
      - profiles
