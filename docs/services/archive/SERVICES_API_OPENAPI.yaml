      summary: Загрузить HTML клиента сервиса
      description: Статическая оболочка без токенов, персональных данных и tenant. После iframe-handshake получает
        service access и вызывает API. Не является доказательством доступа.
      responses:
        '200':
          description: HTML-оболочка.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/html:
              schema:
                type: string
      security: []
  /coursework:
    servers:
    - url: https://coursework.university.example
      description: Локальный экземпляр курсовых; origin утверждает платформа.
    get:
      tags:
      - Client
      operationId: getCourseworkClient
      summary: Загрузить HTML клиента сервиса
      description: Статическая оболочка без токенов, персональных данных и tenant. После iframe-handshake получает
        service access и вызывает API. Не является доказательством доступа.
      responses:
        '200':
          description: HTML-оболочка.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/html:
              schema:
                type: string
      security: []
  /assets/{asset_name}:
    servers:
    - url: https://administration.platform.example
      description: Облачное администрирование; все вузы обслуживает один процесс этого типа.
    - url: https://schedule.platform.example
      description: Облачное расписание; все вузы обслуживает один процесс этого типа.
    - url: https://profiles.platform.example
      description: Облачные анкеты; все вузы обслуживает один процесс этого типа.
    - url: https://coursework.university.example
      description: Локальный экземпляр курсовых; origin утверждает платформа.
    get:
      tags:
      - Client
      operationId: getServiceAsset
      summary: Загрузить статический asset
      description: Только опубликованные файлы данного клиента. Имя содержит hash; не отдаёт произвольный файл с
        диска.
      responses:
        '200':
          description: Опубликованный asset.
          headers:
            Cache-Control:
              schema:
                type: string
                const: public, max-age=31536000, immutable
          content:
            text/javascript:
              schema:
                type: string
            text/css:
              schema:
                type: string
            image/svg+xml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
            font/woff2:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error404'
      parameters:
      - $ref: '#/components/parameters/AssetName'
      security: []
components:
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT service_access
      description: 'Только JWT ядра: aud=service:{service_id}, token_use=service_access. Ни core, ни machine, ни
        refresh. Контекст уточняется introspection своего экземпляра.'
  parameters:
    service_id:
      name: service_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    user_id:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    credential_id:
      name: credential_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    profile_path:
      name: profile
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Profile'
    LocaleQuery:
      name: locale
      in: query
      schema:
        $ref: '#/components/schemas/Locale'
      description: ru по умолчанию. Нет перевода en — fallback ru отдельно для каждой строки.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: Непрозрачный keyset cursor на 15 минут; связан с actor, фильтрами и областью доступа.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 128
        pattern: ^"[^"\\]+"$
      description: Ровно один strong ETag текущего ресурса. Нет заголовка — 428; несовпадение — 412. * запрещён.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
      description: Повтор создания с тем же ключом/телом в течение 24 ч возвращает прежний результат. Иное тело
        — 409.
    group_id:
      name: group_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
      description: ''
    event_id:
      name: event_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
      description: ''
    submission_id:
      name: submission_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
      description: ''
    From:
      name: from
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/DateTime'
      description: Начало полуоткрытого интервала [from,to), UTC Z; не более 31 суток.
    To:
      name: to
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/DateTime'
      description: Конец интервала, строго позже from.
    GroupFilter:
      name: group_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UUID'
      description: Дополнительное сужение; не расширяет доступ по профилю.
    TeacherFilter:
      name: teacher_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UUID'
      description: Дополнительное сужение; не расширяет доступ по профилю.
    Search:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 100
      description: Поиск подстроки display_name без учёта регистра; область поиска — доступные карточки своего вуза.
    SubmissionStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
        - submitted
        - accepted
        - changes_requested
      description: ''
    AssetName:
      name: asset_name
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.(js|css|png|svg|woff2)$
        maxLength: 200
      description: Плоское имя с content hash; без каталогов.
  headers:
    RequestId:
      description: UUID запроса, назначенный ядром.
      schema:
        $ref: '#/components/schemas/UUID'
    NoStore:
      description: Ответ нельзя сохранять в HTTP-кэше.
      schema:
        type: string
        const: no-store
    ETag:
      description: Strong ETag ресурса для If-Match.
      schema:
        type: string
        examples:
        - '"rev-7"'
    Location:
      description: Относительный URI созданного ресурса ядра.
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Число секунд до следующей попытки.
      schema:
        type: integer
        minimum: 1
    Authenticate:
      description: Basic на machine token exchange; Bearer на access-защищённых маршрутах. На body-refresh может
        отсутствовать.
      schema:
        type: string
        examples:
        - Bearer
        - Basic realm="core-service"
  responses:
    Error400:
      description: Невалидный JSON, cursor или синтаксис запроса.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error401:
      description: Аутентификация отсутствует или недействительна; invalid_init_data/refresh/client также дают 401.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        WWW-Authenticate:
          $ref: '#/components/headers/Authenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: Не хватает профиля, scope или актуального permission; защищённая операция запрещена.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: Ресурс не существует либо находится вне области доступа. Public private-prefix всегда 404.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error409:
      description: Конфликт состояния, защищённого инварианта, уникальности или Idempotency-Key.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error412:
      description: Переданный If-Match больше не соответствует версии ресурса.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error422:
      description: Ошибка схемы или доменной валидации; см. error.details.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error428:
      description: Обязательный If-Match отсутствует.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error429:
      description: Превышен лимит запросов.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error503:
      description: Необходимое хранилище или конфигурация недоступны. Повтор не означает гарантированный успех.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error500:
      description: Внутренняя ошибка без раскрытия реализации.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error413:
      description: Файл более 20 MiB или multipart-тело более 21 MiB.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error415:
      description: Неподдерживаемый Content-Type либо файл не является допустимым PDF.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
              enum:
              - BAD_REQUEST
              - INVALID_CURSOR
              - INVALID_INIT_DATA
              - INVALID_REFRESH_TOKEN
              - INVALID_CLIENT
              - UNAUTHENTICATED
              - FORBIDDEN
              - PROTECTED_RESOURCE
              - RESOURCE_NOT_FOUND
              - RESOURCE_INACTIVE
              - MEMBERSHIP_ALREADY_EXISTS
              - SERVICE_ALREADY_EXISTS
              - ROLE_ALREADY_EXISTS
              - ROLE_IN_USE
              - LAST_OWNER
              - MANIFEST_REQUIRED
              - CREDENTIAL_LIMIT
              - IDEMPOTENCY_CONFLICT
              - PRECONDITION_FAILED
              - PRECONDITION_REQUIRED
              - VALIDATION_ERROR
              - INVALID_ROLE_ASSIGNMENT
              - RATE_LIMITED
              - SERVICE_UNAVAILABLE
              - INTERNAL_ERROR
              - INSTANCE_NOT_READY
              - GROUP_ALREADY_EXISTS
              - GROUP_IN_USE
              - STUDENT_ALREADY_GROUPED
              - INVALID_REFERENCE
              - INVALID_TIME_RANGE
              - INVALID_STATE
              - PAYLOAD_TOO_LARGE
              - UNSUPPORTED_MEDIA_TYPE
              - FILE_STORAGE_UNAVAILABLE
            message:
              type: string
              maxLength: 500
            request_id:
              $ref: '#/components/schemas/UUID'
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
              maxItems: 100
      examples:
      - error:
          code: RESOURCE_NOT_FOUND
          message: Ресурс не найден
          request_id: 7de86629-e295-46c1-85c1-d0322ec97d3a
    GroupInput:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    Group:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
          minLength: 1
          maxLength: 100
    GroupStudentsInput:
      type: object
      additionalProperties: false
      required:
      - user_ids
      properties:
        user_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 0
          maxItems: 500
          uniqueItems: true
    GroupStudents:
      type: object
      additionalProperties: false
      required:
      - group_id
      - user_ids
      properties:
        group_id:
          $ref: '#/components/schemas/UUID'
        user_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 0
          maxItems: 500
          uniqueItems: true
    EventInput:
      type: object
      additionalProperties: false
      required:
      - title
      - starts_at
      - ends_at
      - group_ids
      - teacher_ids
      - location
      - description
      - status
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        starts_at:
          $ref: '#/components/schemas/DateTime'
        ends_at:
          $ref: '#/components/schemas/DateTime'
        group_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 1
          maxItems: 50
          uniqueItems: true
        teacher_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 1
          maxItems: 10
          uniqueItems: true
        location:
          type: string
          minLength: 0
          maxLength: 200
        description:
          type: string
          minLength: 0
          maxLength: 2000
        status:
          type: string
          enum:
          - scheduled
          - cancelled
      description: Одно конкретное занятие без recurrence. starts_at < ends_at. Связанные группы и действующие teacher
        — в данном вузе/экземпляре. Все поля обязательны при POST/PUT.
      examples:
      - title: Математический анализ
        starts_at: '2026-09-28T06:00:00Z'
        ends_at: '2026-09-28T07:30:00Z'
        group_ids:
        - 30c417e5-983e-4d1f-bdd0-ae1fd7ff5e80
        teacher_ids:
        - a76e24db-05e7-4cde-8a60-fbe3b5e5dd42
        location: Аудитория 205
        description: ''
        status: scheduled
    Event:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - starts_at
      - ends_at
      - group_ids
      - teacher_ids
      - location
      - description
      - status
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
          minLength: 1
          maxLength: 200
        starts_at:
          $ref: '#/components/schemas/DateTime'
        ends_at:
          $ref: '#/components/schemas/DateTime'
        group_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 1
          maxItems: 50
          uniqueItems: true
        teacher_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 1
          maxItems: 10
          uniqueItems: true
        location:
          type: string
          minLength: 0
          maxLength: 200
        description:
          type: string
          minLength: 0
          maxLength: 2000
        status:
          type: string
          enum:
          - scheduled
          - cancelled
    GroupPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Group'
          minItems: 0
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
    EventPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          minItems: 0
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
    ProfileCard:
      type: object
      additionalProperties: false
      required:
      - user_id
      - display_name
      - about
      - position
      - academic_degree
      properties:
        user_id:
          $ref: '#/components/schemas/UUID'
        display_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 200
        about:
          type: string
          minLength: 0
          maxLength: 2000
        position:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 200
        academic_degree:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 200
      description: Одна анкета на user_id в данном экземпляре, общая для admin/teacher/student. GET для действующего
        участника без анкеты возвращает виртуальную пустую карточку и ETag, не создавая строку. Только position/academic_degree
        допускают явный null для очистки.
    SelfCardPatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        about:
          type: string
          minLength: 0
          maxLength: 2000
      minProperties: 1
      examples:
      - display_name: Иван Иванов
        about: Студент второго курса
    AcademicCardPatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        position:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 200
        academic_degree:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 200
      minProperties: 1
    ProfileCardPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProfileCard'
          minItems: 0
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
    ReviewInput:
      type: object
      additionalProperties: false
