        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      security:
      - ServiceBearer: []
      description: 'Публичный endpoint backend администрирования. Только profile=admin и актуальный institution.read.
        Вуз и экземпляр actor берутся из JWT. Backend вызывает соответствующий private endpoint ядра с machine JWT
        своего administration binding и X-Actor-Token, равным входному service access. Тела и ETag сохраняются;
        Location переписывается на публичный facade. Дополнительные ограничения (последний owner, защищённый administration,
        owner-only назначения administration, cloud credentials) полностью сохраняются. Сетевые/машинные ошибки
        upstream преобразуются в 503, ошибки прав actor сохраняются. Подробное соответствие: x-core-operation.'
      x-required-permission: institution.read
      x-core-operation:
        method: GET
        path: /api/v1/institution/{institution_id}/internal
        operationId: getInstitutionSettings
      x-authorization: online-introspection-and-private-core-check
      x-access-rules:
      - admin AND institution.read
    patch:
      tags:
      - Administration
      summary: Изменить имя или язык вуза
      operationId: adminUpdateInstitutionSettings
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInstitution'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
        '500':
          $ref: '#/components/responses/Error500'
      description: 'Публичный endpoint backend администрирования. Только profile=admin и актуальный institution.update.
        Вуз и экземпляр actor берутся из JWT. Backend вызывает соответствующий private endpoint ядра с machine JWT
        своего administration binding и X-Actor-Token, равным входному service access. Тела и ETag сохраняются;
        Location переписывается на публичный facade. Дополнительные ограничения (последний owner, защищённый administration,
        owner-only назначения administration, cloud credentials) полностью сохраняются. Сетевые/машинные ошибки
        upstream преобразуются в 503, ошибки прав actor сохраняются. Подробное соответствие: x-core-operation.'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstitutionPatch'
      security:
      - ServiceBearer: []
      x-required-permission: institution.update
      x-core-operation:
        method: PATCH
        path: /api/v1/institution/{institution_id}/internal
        operationId: updateInstitutionSettings
      x-authorization: online-introspection-and-private-core-check
      x-access-rules:
      - admin AND institution.update
