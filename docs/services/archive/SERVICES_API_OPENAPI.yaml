      description: Карточка в контексте текущего пользователя и выбранного профиля. Только разрешённые меню; секретов
        нет.
      examples:
      - id: b4c51283-fbdf-44a2-91e8-7f3d07f52e1a
        institution_id: 46bf3278-29fa-4d0a-a711-e4a6a324ed31
        service_type: user-profile
        deployment: cloud
        display_name: Профиль пользователя
        locale: ru
        api_base_url: https://profiles-api.platform.example/api/v1
        client_base_url: https://profiles-ui.platform.example
        profile: teacher
        roles: []
        permissions: []
        menus:
        - id: home
          display_name: Главная
          locale: ru
          entrypoint_path: /home
          order: 0
        - id: users
          display_name: Пользователи
          locale: ru
          entrypoint_path: /users
          order: 10
    AdminInstitution:
      type: object
      additionalProperties: false
      required:
