openapi: 3.1.1
info:
  title: Вузы России — API сервисов
  version: 0.1.0
  description: Предложение от 2026-09-26, не текущая реализация. Общий SDK-контракт и доменные API administration,
    schedule, user-profile, coursework. Каждый path имеет собственные servers; общий раздел доступен на каждом сервисе.
    Клиент получает api_base_url из ядра; он уже включает /api/v1, повторно добавлять префикс нельзя. Tenant только
    из проверенного service_access; query/body не переключают вуз, экземпляр или профиль. Все защищённые операции
    используют online introspection. Сопутствующий SERVICES_API_SPEC.md задаёт provisioning, изоляцию, RBAC и протокол
    iframe. Схемы общего ядра включены локально для автономного чтения; источник — CORE_API_OPENAPI.yaml 0.1.0.
    Extensions x-* документируют обязанности реализации.
servers:
- url: https://administration.platform.example
  description: Облачное администрирование; все вузы обслуживает один процесс этого типа.
- url: https://schedule.platform.example
  description: Облачное расписание; все вузы обслуживает один процесс этого типа.
- url: https://profiles.platform.example
  description: Облачные анкеты; все вузы обслуживает один процесс этого типа.
- url: https://coursework.university.example
  description: Локальный экземпляр курсовых; origin утверждает платформа.
security:
- ServiceBearer: []
tags:
- name: Common
- name: Administration
- name: Schedule groups
- name: Schedule events
- name: User profile
- name: Coursework
- name: Client
paths:
  /api/v1/health:
    servers:
    - url: https://administration.platform.example
      description: Облачное администрирование; все вузы обслуживает один процесс этого типа.
    - url: https://schedule.platform.example
      description: Облачное расписание; все вузы обслуживает один процесс этого типа.
    - url: https://profiles.platform.example
      description: Облачные анкеты; все вузы обслуживает один процесс этого типа.
    - url: https://coursework.university.example
      description: Локальный экземпляр курсовых; origin утверждает платформа.
    get:
      tags:
      - Common
      operationId: getServiceHealth
      summary: Проверить живость процесса
      description: Только liveness, без сведений о вузах, БД и credentials.
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/Error500'
      security: []
  /api/v1/service:
    servers:
    - url: https://administration.platform.example
      description: Облачное администрирование; все вузы обслуживает один процесс этого типа.
    - url: https://schedule.platform.example
      description: Облачное расписание; все вузы обслуживает один процесс этого типа.
    - url: https://profiles.platform.example
      description: Облачные анкеты; все вузы обслуживает один процесс этого типа.
    - url: https://coursework.university.example
      description: Локальный экземпляр курсовых; origin утверждает платформа.
    get:
      tags:
      - Common
      operationId: getCurrentService
      summary: Получить экземпляр, контекст и доступные меню
      description: ServiceView совместим с ядром. id, institution_id, service_type и URLs — из доверенного binding;
        profile и актуальные права — из introspection. Manifest читается из ядра и фильтруется по этим правам. Профиль
        нельзя выбрать параметром. Не выдаёт credentials.
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceView'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      x-authorization: online-introspection
      x-access-rules:
      - Любой поддерживаемый профиль с активной service session.
      parameters:
      - $ref: '#/components/parameters/LocaleQuery'
  /api/v1/administration:
