          $ref: '#/components/schemas/InstitutionStatus'
    InstitutionPatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        titles:
          $ref: '#/components/schemas/LocalizedText'
        default_locale:
          $ref: '#/components/schemas/Locale'
      minProperties: 1
