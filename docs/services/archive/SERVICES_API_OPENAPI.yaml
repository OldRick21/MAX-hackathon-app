        user_id:
          $ref: '#/components/schemas/UUID'
        profiles:
          $ref: '#/components/schemas/Profiles'
      description: Пользователь уже должен войти через MAX. Не допускается поиск/создание аккаунта по произвольному
        MAX ID.
      examples:
      - user_id: a76e24db-05e7-4cde-8a60-fbe3b5e5dd42
        profiles:
        - student
        - teacher
    ProfilesInput:
      type: object
      additionalProperties: false
      required:
      - profiles
      properties:
        profiles:
          $ref: '#/components/schemas/Profiles'
    AdminServicePage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminService'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
    AdminService:
      type: object
      additionalProperties: false
      required:
      - id
      - institution_id
      - service_type
      - deployment
      - enabled
      - protected
      - api_base_url
      - client_base_url
      - supported_profiles
      - manifest
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        institution_id:
          $ref: '#/components/schemas/UUID'
        service_type:
          $ref: '#/components/schemas/ServiceTypeCode'
        deployment:
          $ref: '#/components/schemas/Deployment'
        enabled:
          type: boolean
        protected:
          type: boolean
        api_base_url:
          $ref: '#/components/schemas/HttpsApiUrl'
        client_base_url:
          $ref: '#/components/schemas/HttpsOrigin'
        supported_profiles:
          $ref: '#/components/schemas/Profiles'
        manifest:
          $ref: '#/components/schemas/ServiceManifest'
        created_at:
          $ref: '#/components/schemas/DateTime'
    ServiceCreate:
      oneOf:
      - $ref: '#/components/schemas/CloudServiceCreate'
      - $ref: '#/components/schemas/LocalServiceCreate'
    ServicePatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        enabled:
          type: boolean
        api_base_url:
          $ref: '#/components/schemas/HttpsApiUrl'
        client_base_url:
          $ref: '#/components/schemas/HttpsOrigin'
      minProperties: 1
      description: URL меняется только у local и только на approved hostname. URL change требует enabled=false или
        отсутствующего enabled; ядро отключает экземпляр.
    RolePage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
    AssignmentSet:
      type: object
      additionalProperties: false
      required:
      - institution_id
      - service_id
      - user_id
      - profile
      - roles
      - permissions
      properties:
        institution_id:
          $ref: '#/components/schemas/UUID'
        service_id:
          $ref: '#/components/schemas/UUID'
        user_id:
          $ref: '#/components/schemas/UUID'
        profile:
          $ref: '#/components/schemas/Profile'
        roles:
          $ref: '#/components/schemas/RoleCodes'
        permissions:
          $ref: '#/components/schemas/Permissions'
    AssignmentInput:
      type: object
      additionalProperties: false
      required:
      - roles
      properties:
        roles:
          $ref: '#/components/schemas/RoleCodes'
      description: Полная замена назначений; [] снимает все роли. Не создаёт membership или профиль.
      examples:
      - roles: []
    CredentialPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
    IssuedCredential:
      type: object
      additionalProperties: false
      required:
      - credential
      - client_secret
      properties:
        credential:
          $ref: '#/components/schemas/Credential'
        client_secret:
          type: string
          minLength: 43
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Показывается один раз; минимум 256 бит случайности.
    UUID:
      type: string
      format: uuid
      examples:
      - 46bf3278-29fa-4d0a-a711-e4a6a324ed31
    Code:
      type: string
      pattern: ^[a-z][a-z0-9_.-]{0,63}$
      maxLength: 64
    Profile:
      type: string
      enum:
      - admin
      - teacher
      - student
    Locale:
      type: string
      enum:
      - ru
      - en
      default: ru
    DateTime:
      type: string
      format: date-time
      description: RFC 3339 UTC, суффикс Z.
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - path
      - message
      properties:
        path:
          type: string
          maxLength: 256
        message:
          type: string
          maxLength: 500
      description: path — JSON Pointer либо имя параметра. В message не отражаются входные секреты.
    ServiceTypeCode:
      type: string
      enum:
      - administration
      - schedule
      - user-profile
      - coursework
    Deployment:
      type: string
      enum:
      - cloud
      - local
    HttpsApiUrl:
      type: string
      format: uri
      pattern: ^https://[^/?#@]+(?:/[^?#]*)?$
      maxLength: 2048
      description: HTTPS URL, разрешённый платформой. Может иметь path-prefix. Дополнительные проверки hostname
        и allowlist — в спецификации.
    HttpsOrigin:
      type: string
      format: uri
      pattern: ^https://[^/?#@]+$
      maxLength: 2048
      description: Только origin, без завершающего / и пути. DNS hostname должен быть одобрен оператором.
    RoleCodes:
      type: array
      items:
        $ref: '#/components/schemas/Code'
      maxItems: 32
      uniqueItems: true
    Permissions:
      type: array
      items:
        $ref: '#/components/schemas/Code'
      maxItems: 128
      uniqueItems: true
      description: Коды из неизменяемого платформой словаря соответствующего типа сервиса.
    MenuView:
      type: object
      additionalProperties: false
      required:
      - id
      - display_name
      - locale
      - entrypoint_path
      - order
      properties:
        id:
          $ref: '#/components/schemas/Code'
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        locale:
          $ref: '#/components/schemas/Locale'
        entrypoint_path:
          $ref: '#/components/schemas/EntrypointPath'
        order:
          type: integer
          minimum: 0
          maximum: 10000
    LocalizedText:
      type: object
      additionalProperties: false
      required:
      - ru
      properties:
        ru:
          type: string
          minLength: 1
          maxLength: 200
        en:
          type: string
          minLength: 1
          maxLength: 200
      description: Переводы для MVP. ru обязателен и служит fallback.
      examples:
      - ru: Расписание
        en: Schedule
    InstitutionStatus:
      type: string
      enum:
      - pending
      - active
      - suspended
    ServiceType:
      type: object
      additionalProperties: false
      required:
      - code
      - deployment
      - titles
      - supported_profiles
      - permission_codes
      - protected
      properties:
        code:
          $ref: '#/components/schemas/ServiceTypeCode'
        deployment:
          $ref: '#/components/schemas/Deployment'
        titles:
          $ref: '#/components/schemas/LocalizedText'
        supported_profiles:
          $ref: '#/components/schemas/Profiles'
        permission_codes:
          $ref: '#/components/schemas/Permissions'
        protected:
          type: boolean
      description: Утверждённый платформой тип. protected=true у administration. Не описывает HTTP API сервиса.
    Profiles:
      type: array
      items:
        $ref: '#/components/schemas/Profile'
      minItems: 1
      maxItems: 3
      uniqueItems: true
    ServiceManifest:
      type: object
      additionalProperties: false
      required:
      - titles
      - menus
      properties:
        titles:
          $ref: '#/components/schemas/LocalizedText'
        menus:
          type: array
          items:
            $ref: '#/components/schemas/MenuDefinition'
          maxItems: 32
      description: ID меню уникальны внутри manifest. Профили и permissions проверяются по каталогу типа. Пустой
        manifest допустим до включения.
    CloudServiceCreate:
      type: object
      additionalProperties: false
      required:
      - service_type
      - deployment
      properties:
        service_type:
          type: string
          enum:
          - schedule
          - user-profile
        deployment:
          type: string
          const: cloud
      description: Создаётся включённым с URLs и manifest из конфигурации платформы. administration создаётся только
        при bootstrap.
      examples:
      - service_type: schedule
        deployment: cloud
    LocalServiceCreate:
      type: object
      additionalProperties: false
      required:
      - service_type
      - deployment
      - api_base_url
      - client_base_url
      properties:
        service_type:
          type: string
          const: coursework
        deployment:
          type: string
          const: local
        api_base_url:
          $ref: '#/components/schemas/HttpsApiUrl'
        client_base_url:
          $ref: '#/components/schemas/HttpsOrigin'
      description: Создаётся выключенным; hostname предварительно разрешён оператором. Дальше credential, manifest,
        включение.
      examples:
      - service_type: coursework
        deployment: local
        api_base_url: https://coursework.university.example/api/v1
        client_base_url: https://coursework-ui.university.example
    Role:
      type: object
      additionalProperties: false
      required:
      - service_id
      - code
      - titles
      - allowed_profiles
      - permissions
      - system
      properties:
        service_id:
          $ref: '#/components/schemas/UUID'
        code:
          $ref: '#/components/schemas/Code'
        titles:
          $ref: '#/components/schemas/LocalizedText'
        allowed_profiles:
          $ref: '#/components/schemas/Profiles'
        permissions:
          $ref: '#/components/schemas/Permissions'
        system:
          type: boolean
    Credential:
      type: object
      additionalProperties: false
      required:
      - id
      - client_id
      - service_id
      - created_at
      - revoked_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        client_id:
          $ref: '#/components/schemas/UUID'
        service_id:
          $ref: '#/components/schemas/UUID'
        created_at:
          $ref: '#/components/schemas/DateTime'
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
    EntrypointPath:
      type: string
      pattern: ^/(?!/)[A-Za-z0-9_./-]*$
      maxLength: 1024
      description: Путь внутри client origin. Дополнительно запрещены сегменты . и ..; URL-encoding, query, fragment
        и backslash не поддерживаются.
    MenuDefinition:
      type: object
      additionalProperties: false
      required:
      - id
      - titles
      - entrypoint_path
      - profiles
      - required_permissions
      - order
      properties:
        id:
          $ref: '#/components/schemas/Code'
        titles:
          $ref: '#/components/schemas/LocalizedText'
        entrypoint_path:
          $ref: '#/components/schemas/EntrypointPath'
        profiles:
          $ref: '#/components/schemas/Profiles'
        required_permissions:
          $ref: '#/components/schemas/Permissions'
        order:
          type: integer
          minimum: 0
          maximum: 10000
