        Location переписывается на публичный facade. Дополнительные ограничения (последний owner, защищённый administration,
        owner-only назначения administration, cloud credentials) полностью сохраняются. Сетевые/машинные ошибки
        upstream преобразуются в 503, ошибки прав actor сохраняются. Подробное соответствие: x-core-operation.'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
