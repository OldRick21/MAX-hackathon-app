      description: Статическая оболочка без токенов, персональных данных и tenant. После iframe-handshake получает
        service access и вызывает API. Не является доказательством доступа.
      responses:
        '200':
          description: HTML-оболочка.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/html:
              schema:
                type: string
      security: []
  /api/v1/administration/services/{service_id}/widgets:
    servers:
    - url: https://administration.platform.example
    get:
      tags:
      - Administration
      operationId: listAdministrationWidgets
      summary: Виджеты сервиса на главной
      description: 'Фасад GET .../internal/services/{service_id}/widgets ядра; право services.read. Для каждого виджета — service_visibility (чтение) и visibility (уровень вуза).'
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  next_cursor:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      security:
      - ServiceBearer: []
  /api/v1/administration/services/{service_id}/widgets/{widget_id}/visibility:
    servers:
    - url: https://administration.platform.example
    put:
      tags:
      - Administration
      operationId: setAdministrationWidgetVisibility
      summary: Включить или выключить виджет для профилей
      description: 'Фасад PUT .../widgets/{widget_id}/visibility ядра; право services.manage, If-Match обязателен.'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [visibility]
              properties:
                visibility:
                  type: object
                  additionalProperties: {type: boolean}
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  next_cursor:
                    type: 'null'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '412':
          $ref: '#/components/responses/Error412'
        '422':
          $ref: '#/components/responses/Error422'
        '428':
          $ref: '#/components/responses/Error428'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      security:
      - ServiceBearer: []
  /api/v1/administration/group-chats:
    get:
      tags: [Administration]
      summary: Список учебных групп и ссылок на чаты MAX
      operationId: adminListGroupChats
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Успешно.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyGroupChatPage' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '422': { $ref: '#/components/responses/Error422' }
        '503': { $ref: '#/components/responses/Error503' }
      security: [{ ServiceBearer: [] }]
      x-required-permission: group_chats.manage
      x-core-operation:
        method: GET
        path: /api/v1/institution/{institution_id}/internal/group-chats
        operationId: listInstitutionGroupChats
  /api/v1/administration/groups/{group_id}/chat:
    parameters:
    - $ref: '#/components/parameters/group_id'
    get:
      tags: [Administration]
      summary: Прочитать ссылку на чат группы и ETag
      operationId: adminGetGroupChat
      responses:
        '200':
          description: Успешно.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyGroupChat' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '503': { $ref: '#/components/responses/Error503' }
      security: [{ ServiceBearer: [] }]
      x-required-permission: group_chats.manage
      x-core-operation:
        method: GET
        path: /api/v1/institution/{institution_id}/internal/groups/{group_id}/chat
        operationId: getInstitutionGroupChat
    put:
      tags: [Administration]
      summary: Задать или удалить ссылку на чат группы
      operationId: adminSetGroupChat
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudyGroupChatInput' }
      responses:
        '200':
          description: Успешно.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyGroupChat' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '412': { $ref: '#/components/responses/Error412' }
        '422': { $ref: '#/components/responses/Error422' }
        '428': { $ref: '#/components/responses/Error428' }
        '503': { $ref: '#/components/responses/Error503' }
      security: [{ ServiceBearer: [] }]
      x-required-permission: group_chats.manage
      x-core-operation:
        method: PUT
        path: /api/v1/institution/{institution_id}/internal/groups/{group_id}/chat
        operationId: setInstitutionGroupChat
components:
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT service_access
      description: 'Только JWT ядра: aud=service:{service_id}, token_use=service_access. Ни core, ни machine, ни
        refresh. Контекст уточняется introspection своего экземпляра.'
  parameters:
    group_id:
      name: group_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    service_id:
      name: service_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    user_id:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    credential_id:
      name: credential_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    profile_path:
      name: profile
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Profile'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: Непрозрачный keyset cursor на 15 минут; связан с actor, фильтрами и областью доступа.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 128
        pattern: ^"[^"\\]+"$
      description: Ровно один strong ETag текущего ресурса. Нет заголовка — 428; несовпадение — 412. * запрещён.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
      description: Повтор создания с тем же ключом/телом в течение 24 ч возвращает прежний результат. Иное тело
        — 409.
  headers:
    RequestId:
      description: UUID запроса, назначенный ядром.
      schema:
        $ref: '#/components/schemas/UUID'
    NoStore:
      description: Ответ нельзя сохранять в HTTP-кэше.
      schema:
        type: string
        const: no-store
    ETag:
      description: Strong ETag ресурса для If-Match.
      schema:
        type: string
        examples:
        - '"rev-7"'
    Location:
      description: Относительный URI созданного ресурса ядра.
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Число секунд до следующей попытки.
      schema:
        type: integer
        minimum: 1
    Authenticate:
      description: Basic на machine token exchange; Bearer на access-защищённых маршрутах. На body-refresh может
        отсутствовать.
      schema:
        type: string
        examples:
        - Bearer
        - Basic realm="core-service"
  responses:
    Error400:
      description: Невалидный JSON, cursor или синтаксис запроса.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error401:
      description: Аутентификация отсутствует или недействительна; invalid_init_data/refresh/client также дают 401.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        WWW-Authenticate:
          $ref: '#/components/headers/Authenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: Не хватает профиля, scope или актуального permission; защищённая операция запрещена.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: Ресурс не существует либо находится вне области доступа. Public private-prefix всегда 404.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error409:
      description: Конфликт состояния, защищённого инварианта, уникальности или Idempotency-Key.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error412:
      description: Переданный If-Match больше не соответствует версии ресурса.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error422:
      description: Ошибка схемы или доменной валидации; см. error.details.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error428:
      description: Обязательный If-Match отсутствует.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error429:
      description: Превышен лимит запросов.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error503:
      description: Необходимое хранилище или конфигурация недоступны. Повтор не означает гарантированный успех.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error500:
      description: Внутренняя ошибка без раскрытия реализации.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    StudyGroupChat:
      type: object
      additionalProperties: false
      required: [group_id, group_name, chat_url, updated_at]
      properties:
        group_id: { $ref: '#/components/schemas/UUID' }
        group_name: { type: string, minLength: 1, maxLength: 100 }
        chat_url: { type: [string, 'null'], format: uri, pattern: '^https://max\.ru/', maxLength: 2048 }
        updated_at: { type: [string, 'null'], format: date-time }
    StudyGroupChatInput:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: [string, 'null'], format: uri, pattern: '^https://max\.ru/', maxLength: 2048 }
    StudyGroupChatPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/StudyGroupChat' }
        next_cursor: { type: [string, 'null'], maxLength: 2048 }
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
              enum:
              - BAD_REQUEST
              - INVALID_CURSOR
              - INVALID_INIT_DATA
              - INVALID_REFRESH_TOKEN
              - INVALID_CLIENT
              - UNAUTHENTICATED
              - FORBIDDEN
              - PROTECTED_RESOURCE
              - RESOURCE_NOT_FOUND
              - RESOURCE_INACTIVE
              - MEMBERSHIP_ALREADY_EXISTS
              - SERVICE_ALREADY_EXISTS
              - ROLE_ALREADY_EXISTS
              - ROLE_IN_USE
              - LAST_OWNER
              - MANIFEST_REQUIRED
              - CREDENTIAL_LIMIT
              - IDEMPOTENCY_CONFLICT
              - PRECONDITION_FAILED
              - PRECONDITION_REQUIRED
              - VALIDATION_ERROR
              - INVALID_ROLE_ASSIGNMENT
              - RATE_LIMITED
              - SERVICE_UNAVAILABLE
              - INTERNAL_ERROR
              - INSTANCE_NOT_READY
              - GROUP_ALREADY_EXISTS
              - GROUP_IN_USE
              - STUDENT_ALREADY_GROUPED
              - INVALID_REFERENCE
              - INVALID_TIME_RANGE
              - INVALID_STATE
              - PAYLOAD_TOO_LARGE
              - UNSUPPORTED_MEDIA_TYPE
              - FILE_STORAGE_UNAVAILABLE
            message:
              type: string
              maxLength: 500
            request_id:
              $ref: '#/components/schemas/UUID'
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
              maxItems: 100
      examples:
      - error:
          code: RESOURCE_NOT_FOUND
          message: Ресурс не найден
          request_id: 7de86629-e295-46c1-85c1-d0322ec97d3a
    AdminInstitution:
      type: object
      additionalProperties: false
      required:
      - id
      - titles
      - default_locale
      - status
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        titles:
          $ref: '#/components/schemas/LocalizedText'
        default_locale:
          $ref: '#/components/schemas/Locale'
        status:
          $ref: '#/components/schemas/InstitutionStatus'
    InstitutionPatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        titles:
          $ref: '#/components/schemas/LocalizedText'
        default_locale:
          $ref: '#/components/schemas/Locale'
      minProperties: 1
      description: Не меняет статус регистрации/приостановки вуза.
    ServiceTypeList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceType'
          minItems: 4
          maxItems: 4
    MembershipPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
    Membership:
      type: object
      additionalProperties: false
      required:
      - institution_id
      - user_id
      - profiles
      - created_at
      properties:
        institution_id:
          $ref: '#/components/schemas/UUID'
        user_id:
          $ref: '#/components/schemas/UUID'
        profiles:
          $ref: '#/components/schemas/Profiles'
        created_at:
          $ref: '#/components/schemas/DateTime'
    MembershipCreate:
      type: object
      additionalProperties: false
      required:
      - user_id
      - profiles
      properties:
        user_id:
          $ref: '#/components/schemas/UUID'
        profiles:
          $ref: '#/components/schemas/Profiles'
      description: Пользователь уже должен войти через MAX. Не допускается поиск/создание аккаунта по произвольному
        MAX ID.
      examples:
      - user_id: a76e24db-05e7-4cde-8a60-fbe3b5e5dd42
        profiles:
        - student
        - teacher
    ProfilesInput:
      type: object
      additionalProperties: false
      required:
      - profiles
      properties:
        profiles:
          $ref: '#/components/schemas/Profiles'
    AdminServicePage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminService'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
    AdminService:
      type: object
      additionalProperties: false
      required:
      - id
      - institution_id
      - service_type
      - deployment
      - enabled
      - protected
      - api_base_url
      - client_base_url
      - supported_profiles
      - manifest
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        institution_id:
          $ref: '#/components/schemas/UUID'
        service_type:
          $ref: '#/components/schemas/ServiceTypeCode'
        deployment:
          $ref: '#/components/schemas/Deployment'
        enabled:
          type: boolean
        protected:
          type: boolean
        api_base_url:
          $ref: '#/components/schemas/HttpsApiUrl'
        client_base_url:
          $ref: '#/components/schemas/HttpsOrigin'
        supported_profiles:
          $ref: '#/components/schemas/Profiles'
        manifest:
          $ref: '#/components/schemas/ServiceManifest'
        created_at:
          $ref: '#/components/schemas/DateTime'
    ServiceCreate:
      oneOf:
      - $ref: '#/components/schemas/CloudServiceCreate'
      - $ref: '#/components/schemas/LocalServiceCreate'
    ServicePatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        enabled:
          type: boolean
        api_base_url:
          $ref: '#/components/schemas/HttpsApiUrl'
        client_base_url:
          $ref: '#/components/schemas/HttpsOrigin'
      minProperties: 1
      description: URL меняется только у local и только на approved hostname. URL change требует enabled=false или
        отсутствующего enabled; ядро отключает экземпляр.
    RolePage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
    AssignmentSet:
      type: object
      additionalProperties: false
      required:
      - institution_id
      - service_id
      - user_id
      - profile
      - roles
      - permissions
      properties:
        institution_id:
          $ref: '#/components/schemas/UUID'
        service_id:
          $ref: '#/components/schemas/UUID'
        user_id:
          $ref: '#/components/schemas/UUID'
        profile:
          $ref: '#/components/schemas/Profile'
        roles:
          $ref: '#/components/schemas/RoleCodes'
        permissions:
          $ref: '#/components/schemas/Permissions'
    AssignmentInput:
      type: object
      additionalProperties: false
      required:
      - roles
      properties:
        roles:
          $ref: '#/components/schemas/RoleCodes'
      description: Полная замена назначений; [] снимает все роли. Не создаёт membership или профиль.
      examples:
      - roles: []
    CredentialPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
    IssuedCredential:
      type: object
      additionalProperties: false
      required:
      - credential
      - client_secret
      properties:
        credential:
          $ref: '#/components/schemas/Credential'
        client_secret:
          type: string
          minLength: 43
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Показывается один раз; минимум 256 бит случайности.
    UUID:
      type: string
      format: uuid
      examples:
      - 46bf3278-29fa-4d0a-a711-e4a6a324ed31
    Code:
      type: string
      pattern: ^[a-z][a-z0-9_.-]{0,63}$
      maxLength: 64
    Profile:
      type: string
      enum:
      - admin
      - teacher
      - student
    Locale:
      type: string
      enum:
      - ru
      - en
      default: ru
    DateTime:
      type: string
      format: date-time
      description: RFC 3339 UTC, суффикс Z.
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - path
      - message
      properties:
        path:
          type: string
          maxLength: 256
        message:
          type: string
          maxLength: 500
      description: path — JSON Pointer либо имя параметра. В message не отражаются входные секреты.
    ServiceTypeCode:
      type: string
      enum:
      - administration
      - schedule
      - user-profile
      - coursework
    Deployment:
      type: string
      enum:
      - cloud
      - local
    HttpsApiUrl:
      type: string
      format: uri
      pattern: ^https://[^/?#@]+(?:/[^?#]*)?$
      maxLength: 2048
      description: HTTPS URL, разрешённый платформой. Может иметь path-prefix. Дополнительные проверки hostname
        и allowlist — в спецификации.
    HttpsOrigin:
      type: string
      format: uri
      pattern: ^https://[^/?#@]+$
      maxLength: 2048
      description: Только origin, без завершающего / и пути. DNS hostname должен быть одобрен оператором.
    RoleCodes:
      type: array
      items:
        $ref: '#/components/schemas/Code'
      maxItems: 32
      uniqueItems: true
    Permissions:
      type: array
      items:
        $ref: '#/components/schemas/Code'
      maxItems: 128
      uniqueItems: true
      description: Коды из неизменяемого платформой словаря соответствующего типа сервиса.
    LocalizedText:
      type: object
      additionalProperties: false
      required:
      - ru
      properties:
        ru:
          type: string
          minLength: 1
          maxLength: 200
        en:
          type: string
          minLength: 1
          maxLength: 200
      description: Переводы для MVP. ru обязателен и служит fallback.
      examples:
      - ru: Расписание
        en: Schedule
    InstitutionStatus:
      type: string
      enum:
      - pending
      - active
      - suspended
    ServiceType:
      type: object
      additionalProperties: false
      required:
      - code
      - deployment
      - titles
      - supported_profiles
      - permission_codes
      - protected
      properties:
        code:
          $ref: '#/components/schemas/ServiceTypeCode'
        deployment:
          $ref: '#/components/schemas/Deployment'
        titles:
          $ref: '#/components/schemas/LocalizedText'
        supported_profiles:
          $ref: '#/components/schemas/Profiles'
        permission_codes:
          $ref: '#/components/schemas/Permissions'
        protected:
          type: boolean
      description: Утверждённый платформой тип. protected=true у administration. Не описывает HTTP API сервиса.
    Profiles:
      type: array
      items:
        $ref: '#/components/schemas/Profile'
      minItems: 1
      maxItems: 3
      uniqueItems: true
    ServiceManifest:
      type: object
      additionalProperties: false
      required:
      - titles
      - menus
      properties:
        titles:
          $ref: '#/components/schemas/LocalizedText'
        menus:
          type: array
          items:
            $ref: '#/components/schemas/MenuDefinition'
          maxItems: 32
      description: ID меню уникальны внутри manifest. Профили и permissions проверяются по каталогу типа. Пустой
        manifest допустим до включения.
    CloudServiceCreate:
      type: object
      additionalProperties: false
      required:
      - service_type
      - deployment
      properties:
        service_type:
          type: string
          enum:
          - schedule
          - user-profile
        deployment:
          type: string
          const: cloud
      description: Создаётся включённым с URLs и manifest из конфигурации платформы. administration создаётся только
        при bootstrap.
      examples:
      - service_type: schedule
        deployment: cloud
    LocalServiceCreate:
      type: object
      additionalProperties: false
      required:
      - service_type
      - deployment
      - api_base_url
      - client_base_url
      properties:
        service_type:
          type: string
          const: coursework
        deployment:
          type: string
          const: local
        api_base_url:
          $ref: '#/components/schemas/HttpsApiUrl'
        client_base_url:
          $ref: '#/components/schemas/HttpsOrigin'
      description: Создаётся выключенным; hostname предварительно разрешён оператором. Дальше credential, manifest,
        включение.
      examples:
      - service_type: coursework
        deployment: local
        api_base_url: https://coursework.university.example/api/v1
        client_base_url: https://coursework-ui.university.example
    Role:
      type: object
      additionalProperties: false
      required:
      - service_id
      - code
      - titles
      - allowed_profiles
      - permissions
      - system
      properties:
        service_id:
          $ref: '#/components/schemas/UUID'
        code:
          $ref: '#/components/schemas/Code'
        titles:
          $ref: '#/components/schemas/LocalizedText'
        allowed_profiles:
          $ref: '#/components/schemas/Profiles'
        permissions:
          $ref: '#/components/schemas/Permissions'
        system:
          type: boolean
    Credential:
      type: object
      additionalProperties: false
      required:
      - id
      - client_id
      - service_id
      - created_at
      - revoked_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        client_id:
          $ref: '#/components/schemas/UUID'
        service_id:
          $ref: '#/components/schemas/UUID'
        created_at:
          $ref: '#/components/schemas/DateTime'
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
    EntrypointPath:
      type: string
      pattern: ^/(?!/)[A-Za-z0-9_./-]*$
      maxLength: 1024
      description: Путь внутри client origin. Дополнительно запрещены сегменты . и ..; URL-encoding, query, fragment
        и backslash не поддерживаются.
    MenuDefinition:
      type: object
      additionalProperties: false
      required:
      - id
      - titles
      - entrypoint_path
      - profiles
      - required_permissions
      - order
      properties:
        id:
          $ref: '#/components/schemas/Code'
        titles:
          $ref: '#/components/schemas/LocalizedText'
        entrypoint_path:
          $ref: '#/components/schemas/EntrypointPath'
        profiles:
          $ref: '#/components/schemas/Profiles'
        required_permissions:
          $ref: '#/components/schemas/Permissions'
        order:
          type: integer
          minimum: 0
          maximum: 10000
x-shared-contract: ../sdk/OPENAPI.yaml
