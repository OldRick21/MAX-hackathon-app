        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstitutionPatch'
      security:
      - ServiceBearer: []
      x-required-permission: institution.update
      x-core-operation:
        method: PATCH
        path: /api/v1/institution/{institution_id}/internal
        operationId: updateInstitutionSettings
      x-authorization: online-introspection-and-private-core-check
      x-access-rules:
      - admin AND institution.update
