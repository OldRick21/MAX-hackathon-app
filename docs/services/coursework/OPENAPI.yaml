openapi: 3.1.1
info:
  title: Вузы России — Локальный сервис курсовых
  version: 0.1.0
  description: 'Только собственные операции сервиса и его HTML entrypoints. Полный API сервиса = этот контракт +
    ../sdk/OPENAPI.yaml. Общие операции SDK здесь не дублируются. Разделение SERVICES_API_OPENAPI.yaml 0.1.0 без
    изменения HTTP-поведения. Правила: SPEC.md; общие требования: ../sdk/SPEC.md. Схемы включены локально; внешних
    $ref нет. Это проект, не текущая реализация.'
servers:
- url: https://coursework.university.example
  description: Локальный экземпляр курсовых; origin утверждает платформа.
security:
- ServiceBearer: []
tags:
- name: Home widgets
  description: Данные виджетов главного экрана (docs/services/sdk/WIDGETS_SPEC.md).
- name: Coursework
- name: Client
paths:
  /api/v1/coursework/submissions:
    servers:
    - url: https://coursework.university.example
      description: Локальный экземпляр курсовых; origin утверждает платформа.
    get:
      tags:
      - Coursework
      operationId: listSubmissions
      summary: Список доступных курсовых
      description: Порядок id ASC. Чужие работы исключены до пагинации.
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      x-authorization: online-introspection
      x-access-rules:
      - 'student: только student_id=sub.'
      - 'teacher: только teacher_id=sub.'
      - 'admin AND coursework.manage: все работы экземпляра.'
      parameters:
      - $ref: '#/components/parameters/SubmissionStatus'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      tags:
      - Coursework
      operationId: submitCoursework
      summary: Загрузить курсовую
      description: student_id берётся из JWT. teacher_id обязан иметь актуальный teacher в вузе; эта запись назначает
        проверяющего. Начальные status=submitted, version=1, review=null. Повтор ключа сверяет нормализованные поля,
        имя и SHA-256 файла. Максимум всего multipart 21 MiB.
      responses:
        '201':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
      x-authorization: online-introspection
      x-access-rules:
      - student.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmissionUpload'
            encoding:
              file:
                contentType: application/pdf
  /api/v1/coursework/submissions/{submission_id}:
    servers:
    - url: https://coursework.university.example
      description: Локальный экземпляр курсовых; origin утверждает платформа.
    get:
      tags:
      - Coursework
      operationId: getSubmission
      summary: Прочитать курсовую
      description: ''
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      x-authorization: online-introspection
      x-access-rules:
      - 'student: только student_id=sub.'
      - 'teacher: только teacher_id=sub.'
      - 'admin AND coursework.manage: все работы экземпляра.'
      parameters:
      - $ref: '#/components/parameters/submission_id'
    delete:
      tags:
      - Coursework
      operationId: deleteSubmission
      summary: Удалить курсовую из выдачи
      description: Студент может удалить только свою submitted/changes_requested. Администратор с coursework.manage
        — любую. Физическая очистка файла после commit; история аудита сохраняется.
      responses:
        '204':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
      x-authorization: online-introspection
      x-access-rules:
      - student AND student_id=sub AND status!=accepted.
      - admin AND coursework.manage.
      parameters:
      - $ref: '#/components/parameters/submission_id'
      - $ref: '#/components/parameters/IfMatch'
  /api/v1/coursework/submissions/{submission_id}/file:
    servers:
    - url: https://coursework.university.example
      description: Локальный экземпляр курсовых; origin утверждает платформа.
    put:
      tags:
      - Coursework
      operationId: replaceSubmissionFile
      summary: Загрузить новую версию курсовой
      description: If-Match от GET курсовой. Только status=submitted или changes_requested. Увеличивает version,
        сбрасывает review=null и status=submitted. accepted неизменяема. title/teacher_id не меняются.
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
      x-authorization: online-introspection
      x-access-rules:
      - student AND student_id=sub.
      parameters:
      - $ref: '#/components/parameters/submission_id'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmissionFileUpload'
            encoding:
              file:
                contentType: application/pdf
    get:
      tags:
      - Coursework
      operationId: downloadSubmissionFile
      summary: Скачать текущий PDF
      description: Только авторизованный fetch с bearer; не переход по URL. Возвращает attachment, не публичную
        ссылку. Range/частичные загрузки не поддерживаются; ответ полный 200.
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="coursework.pdf"; filename*=UTF-8''<очищенное имя>
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      x-authorization: online-introspection
      x-access-rules:
      - 'student: только student_id=sub.'
      - 'teacher: только teacher_id=sub.'
      - 'admin AND coursework.manage: все работы экземпляра.'
      parameters:
      - $ref: '#/components/parameters/submission_id'
  /api/v1/coursework/submissions/{submission_id}/review:
    servers:
    - url: https://coursework.university.example
      description: Локальный экземпляр курсовых; origin утверждает платформа.
    put:
      tags:
      - Coursework
      operationId: reviewSubmission
      summary: Проверить текущую версию курсовой
      description: If-Match от GET курсовой связывает решение с версией файла. Только status=submitted; повтор/изменение
        завершённого решения — 409 INVALID_STATE. Нельзя проверять собственную работу даже после переключения профиля.
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
      x-authorization: online-introspection
      x-access-rules:
      - teacher AND teacher_id=sub AND student_id!=sub.
      parameters:
      - $ref: '#/components/parameters/submission_id'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
  /coursework:
    servers:
    - url: https://coursework.university.example
      description: Локальный экземпляр курсовых; origin утверждает платформа.
    get:
      tags:
      - Client
      operationId: getCourseworkClient
      summary: Загрузить HTML клиента сервиса
      description: Статическая оболочка без токенов, персональных данных и tenant. После iframe-handshake получает
        service access и вызывает API. Не является доказательством доступа.
      responses:
        '200':
          description: HTML-оболочка.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/html:
              schema:
                type: string
      security: []
  /api/v1/coursework/widgets/my-work:
    servers:
    - url: https://coursework.university.example
    get:
      tags:
      - Home widgets
      operationId: getCourseworkWidgetMyWork
      summary: Виджет «Моя курсовая»
      description: 'Последние три работы студента со статусом проверки.'
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetData'
        '204':
          description: Показывать нечего — карточка скрыта.
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      security:
      - ServiceBearer: []
  /api/v1/coursework/widgets/to-review:
    servers:
    - url: https://coursework.university.example
    get:
      tags:
      - Home widgets
      operationId: getCourseworkWidgetToReview
      summary: Виджет «На проверке»
      description: 'Работы, ожидающие проверки у преподавателя.'
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetData'
        '204':
          description: Показывать нечего — карточка скрыта.
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      security:
      - ServiceBearer: []
  /api/v1/coursework/widgets/all:
    servers:
    - url: https://coursework.university.example
    get:
      tags:
      - Home widgets
      operationId: getCourseworkWidgetAll
      summary: Виджет «Курсовые в вузе»
      description: 'Все работы вуза и ожидающие проверки; admin с coursework.manage.'
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetData'
        '204':
          description: Показывать нечего — карточка скрыта.
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      security:
      - ServiceBearer: []
components:
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT service_access
      description: 'Только JWT ядра: aud=service:{service_id}, token_use=service_access. Ни core, ни machine, ни
        refresh. Контекст уточняется introspection своего экземпляра.'
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: Непрозрачный keyset cursor на 15 минут; связан с actor, фильтрами и областью доступа.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 128
        pattern: ^"[^"\\]+"$
      description: Ровно один strong ETag текущего ресурса. Нет заголовка — 428; несовпадение — 412. * запрещён.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
      description: Повтор создания с тем же ключом/телом в течение 24 ч возвращает прежний результат. Иное тело
        — 409.
    submission_id:
      name: submission_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
      description: ''
    SubmissionStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
        - submitted
        - accepted
        - changes_requested
      description: ''
  headers:
    RequestId:
      description: UUID запроса, назначенный ядром.
      schema:
        $ref: '#/components/schemas/UUID'
    NoStore:
      description: Ответ нельзя сохранять в HTTP-кэше.
      schema:
        type: string
        const: no-store
    ETag:
      description: Strong ETag ресурса для If-Match.
      schema:
        type: string
        examples:
        - '"rev-7"'
    Location:
      description: Относительный URI созданного ресурса ядра.
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Число секунд до следующей попытки.
      schema:
        type: integer
        minimum: 1
    Authenticate:
      description: Basic на machine token exchange; Bearer на access-защищённых маршрутах. На body-refresh может
        отсутствовать.
      schema:
        type: string
        examples:
        - Bearer
        - Basic realm="core-service"
  responses:
    Error400:
      description: Невалидный JSON, cursor или синтаксис запроса.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error401:
      description: Аутентификация отсутствует или недействительна; invalid_init_data/refresh/client также дают 401.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        WWW-Authenticate:
          $ref: '#/components/headers/Authenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: Не хватает профиля, scope или актуального permission; защищённая операция запрещена.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: Ресурс не существует либо находится вне области доступа. Public private-prefix всегда 404.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error409:
      description: Конфликт состояния, защищённого инварианта, уникальности или Idempotency-Key.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error412:
      description: Переданный If-Match больше не соответствует версии ресурса.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error422:
      description: Ошибка схемы или доменной валидации; см. error.details.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error428:
      description: Обязательный If-Match отсутствует.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error429:
      description: Превышен лимит запросов.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error503:
      description: Необходимое хранилище или конфигурация недоступны. Повтор не означает гарантированный успех.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error500:
