            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    WidgetTone:
      type: string
      enum: [normal, muted, accent, warning, danger]
    WidgetData:
      description: Данные виджета главного экрана по шаблону kind (docs/services/sdk/WIDGETS_SPEC.md §7). Тело до 16 KB; 204 — карточку не показывать.
      oneOf:
      - type: object
        additionalProperties: false
        required: [kind, user_id, title, lines]
        properties:
          kind: {const: profile}
          user_id: {$ref: '#/components/schemas/UUID'}
          title: {type: string, maxLength: 120}
          lines: {type: array, maxItems: 3, items: {type: string, maxLength: 80}}
          progress: {type: integer, minimum: 0, maximum: 100}
          hint: {type: string, maxLength: 80}
      - type: object
        additionalProperties: false
        required: [kind, day, items]
        properties:
          kind: {const: events}
          day: {type: [string, 'null'], format: date}
          items:
            type: array
            maxItems: 10
            items:
              type: object
              additionalProperties: false
              required: [title, starts_at, ends_at, status]
              properties:
                title: {type: string, maxLength: 120}
                starts_at: {type: string, format: date-time}
                ends_at: {type: string, format: date-time}
                place: {type: string, maxLength: 80}
                status: {type: string, enum: [scheduled, cancelled]}
          more: {type: integer, minimum: 1}
          empty_text: {type: string, maxLength: 300}
      - type: object
        additionalProperties: false
        required: [kind, items]
        properties:
          kind: {const: list}
          items:
            type: array
            maxItems: 5
            items:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: {type: string, maxLength: 120}
                subtitle: {type: string, maxLength: 80}
                badge: {type: string, maxLength: 80}
                tone: {$ref: '#/components/schemas/WidgetTone'}
          total: {type: integer, minimum: 0}
          empty_text: {type: string, maxLength: 300}
      - type: object
        additionalProperties: false
        required: [kind, value]
        properties:
          kind: {const: stat}
          value: {type: number}
          unit: {type: string, maxLength: 80}
          caption: {type: string, maxLength: 80}
          tone: {$ref: '#/components/schemas/WidgetTone'}
      - type: object
        additionalProperties: false
        required: [kind, value]
        properties:
          kind: {const: progress}
          value: {type: integer, minimum: 0, maximum: 100}
          caption: {type: string, maxLength: 80}
          hint: {type: string, maxLength: 80}
      - type: object
        additionalProperties: false
        required: [kind, title]
        properties:
          kind: {const: notice}
          title: {type: string, maxLength: 120}
          text: {type: string, maxLength: 300}
          tone: {$ref: '#/components/schemas/WidgetTone'}
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
              enum:
              - BAD_REQUEST
              - INVALID_CURSOR
              - INVALID_INIT_DATA
              - INVALID_REFRESH_TOKEN
              - INVALID_CLIENT
              - UNAUTHENTICATED
              - FORBIDDEN
              - PROTECTED_RESOURCE
              - RESOURCE_NOT_FOUND
              - RESOURCE_INACTIVE
              - MEMBERSHIP_ALREADY_EXISTS
              - SERVICE_ALREADY_EXISTS
              - ROLE_ALREADY_EXISTS
              - ROLE_IN_USE
              - LAST_OWNER
              - MANIFEST_REQUIRED
              - CREDENTIAL_LIMIT
              - IDEMPOTENCY_CONFLICT
              - PRECONDITION_FAILED
              - PRECONDITION_REQUIRED
              - VALIDATION_ERROR
              - INVALID_ROLE_ASSIGNMENT
              - RATE_LIMITED
              - SERVICE_UNAVAILABLE
              - INTERNAL_ERROR
              - INSTANCE_NOT_READY
              - GROUP_ALREADY_EXISTS
              - GROUP_IN_USE
              - STUDENT_ALREADY_GROUPED
              - INVALID_REFERENCE
              - INVALID_TIME_RANGE
              - INVALID_STATE
              - PAYLOAD_TOO_LARGE
              - UNSUPPORTED_MEDIA_TYPE
              - FILE_STORAGE_UNAVAILABLE
            message:
              type: string
              maxLength: 500
            request_id:
              $ref: '#/components/schemas/UUID'
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
              maxItems: 100
      examples:
      - error:
          code: RESOURCE_NOT_FOUND
          message: Ресурс не найден
          request_id: 7de86629-e295-46c1-85c1-d0322ec97d3a
    ReviewInput:
      type: object
      additionalProperties: false
      required:
      - decision
      - comment
      properties:
        decision:
          type: string
          enum:
          - accepted
          - changes_requested
        comment:
          type: string
          minLength: 0
          maxLength: 2000
      examples:
      - decision: changes_requested
        comment: Добавьте список источников.
    Review:
      type: object
      additionalProperties: false
      required:
      - decision
      - comment
      - reviewer_id
      - reviewed_at
      properties:
        decision:
          type: string
          enum:
          - accepted
          - changes_requested
        comment:
          type: string
          minLength: 0
          maxLength: 2000
        reviewer_id:
          $ref: '#/components/schemas/UUID'
        reviewed_at:
          $ref: '#/components/schemas/DateTime'
    FileInfo:
      type: object
      additionalProperties: false
      required:
      - original_name
      - size_bytes
      - media_type
      - sha256
      properties:
        original_name:
          type: string
          minLength: 1
          maxLength: 255
        size_bytes:
          type: integer
          minimum: 1
          maximum: 20971520
        media_type:
          type: string
          const: application/pdf
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    Submission:
      type: object
      additionalProperties: false
      required:
      - id
      - student_id
      - teacher_id
      - title
      - status
      - version
      - file
      - review
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        student_id:
          $ref: '#/components/schemas/UUID'
        teacher_id:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum:
          - submitted
          - accepted
          - changes_requested
        version:
          type: integer
          minimum: 1
        file:
          $ref: '#/components/schemas/FileInfo'
        review:
          oneOf:
          - $ref: '#/components/schemas/Review'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
    SubmissionUpload:
      type: object
      additionalProperties: false
      required:
      - title
      - teacher_id
      - file
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        teacher_id:
          $ref: '#/components/schemas/UUID'
        file:
          type: string
          format: binary
          description: Один непустой PDF, максимум 20 MiB. Поле содержит двоичные байты, не base64.
    SubmissionFileUpload:
      type: object
      additionalProperties: false
      required:
      - file
      properties:
        file:
          type: string
          format: binary
          description: Новая версия PDF, до 20 MiB.
    SubmissionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Submission'
          minItems: 0
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
    UUID:
      type: string
      format: uuid
      examples:
      - 46bf3278-29fa-4d0a-a711-e4a6a324ed31
    DateTime:
      type: string
      format: date-time
      description: RFC 3339 UTC, суффикс Z.
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - path
      - message
      properties:
        path:
          type: string
          maxLength: 256
        message:
          type: string
          maxLength: 500
      description: path — JSON Pointer либо имя параметра. В message не отражаются входные секреты.
