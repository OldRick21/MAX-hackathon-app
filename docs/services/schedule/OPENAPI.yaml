openapi: 3.1.1
info:
  title: Вузы России — Сервис расписания
  version: 0.1.0
  description: 'Только собственные операции сервиса и его HTML entrypoints. Полный API сервиса = этот контракт +
    ../sdk/OPENAPI.yaml. Общие операции SDK здесь не дублируются. Разделение SERVICES_API_OPENAPI.yaml 0.1.0 без
    изменения HTTP-поведения. Правила: SPEC.md; общие требования: ../sdk/SPEC.md. Схемы включены локально; внешних
    $ref нет. Это проект, не текущая реализация.'
servers:
- url: https://schedule.platform.example
  description: Облачное расписание; все вузы обслуживает один процесс этого типа.
security:
- ServiceBearer: []
tags:
- name: Home widgets
  description: Данные виджетов главного экрана (docs/services/sdk/WIDGETS_SPEC.md).
- name: Schedule groups
- name: Schedule events
- name: Client
paths:
  /api/v1/schedule/groups:
    servers:
    - url: https://schedule.platform.example
      description: Облачное расписание; все вузы обслуживает один процесс этого типа.
    get:
      tags:
      - Schedule groups
      operationId: listScheduleGroups
      summary: Список доступных групп
      description: Порядок id ASC. Студент без группы получает пустой список. Группы содержат только ID и имя, без
        состава.
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      x-authorization: online-introspection
      x-access-rules:
      - 'student: только своя текущая группа и её занятия.'
      - 'teacher: названия групп вуза; занятия только с собственным sub в teacher_ids.'
      - 'admin AND schedule.read_all: все группы и занятия экземпляра.'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      tags:
      - Schedule groups
      operationId: createScheduleGroup
      summary: Создать учебную группу
      description: Имя уникально внутри экземпляра после trim и Unicode casefold. Группа первоначально пустая.
      responses:
        '201':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
        '409':
          $ref: '#/components/responses/Error409'
      x-authorization: online-introspection
      x-access-rules:
      - admin AND groups.manage.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
  /api/v1/schedule/groups/{group_id}:
    servers:
    - url: https://schedule.platform.example
      description: Облачное расписание; все вузы обслуживает один процесс этого типа.
    get:
      tags:
      - Schedule groups
      operationId: getScheduleGroup
      summary: Прочитать группу
      description: ''
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      x-authorization: online-introspection
      x-access-rules:
      - 'student: только своя текущая группа и её занятия.'
      - 'teacher: названия групп вуза; занятия только с собственным sub в teacher_ids.'
      - 'admin AND schedule.read_all: все группы и занятия экземпляра.'
      parameters:
      - $ref: '#/components/parameters/group_id'
    patch:
      tags:
      - Schedule groups
      operationId: renameScheduleGroup
      summary: Переименовать группу
      description: ''
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
      x-authorization: online-introspection
      x-access-rules:
      - admin AND groups.manage.
      parameters:
      - $ref: '#/components/parameters/group_id'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
    delete:
      tags:
      - Schedule groups
      operationId: deleteScheduleGroup
      summary: Удалить пустую неиспользуемую группу
      description: 409 GROUP_IN_USE, если есть участники или любое занятие с ссылкой на группу, включая отменённое.
      responses:
        '204':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
      x-authorization: online-introspection
      x-access-rules:
      - admin AND groups.manage.
      parameters:
      - $ref: '#/components/parameters/group_id'
      - $ref: '#/components/parameters/IfMatch'
  /api/v1/schedule/groups/{group_id}/students:
    servers:
    - url: https://schedule.platform.example
      description: Облачное расписание; все вузы обслуживает один процесс этого типа.
    get:
      tags:
      - Schedule groups
      operationId: getGroupStudents
      summary: Прочитать состав группы
      description: Отдельная версия состава. Сохранённые UUID могут включать участников, уже удалённых из вуза;
        ответ нужен редактору для очистки.
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupStudents'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      x-authorization: online-introspection
      x-access-rules:
      - admin AND groups.manage.
      parameters:
      - $ref: '#/components/parameters/group_id'
    put:
      tags:
      - Schedule groups
      operationId: replaceGroupStudents
      summary: Атомарно заменить состав группы
      description: Максимум 500 уникальных UUID; каждый имеет student по проверке ядра. Студент состоит максимум
        в одной группе экземпляра. 409 STUDENT_ALREADY_GROUPED, если уже в другой. Пустой массив очищает состав;
        перемещение в MVP — удалить из старой, затем добавить в новую.
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupStudents'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
      x-authorization: online-introspection
      x-access-rules:
      - admin AND groups.manage.
      parameters:
      - $ref: '#/components/parameters/group_id'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupStudentsInput'
  /api/v1/schedule/events:
    servers:
    - url: https://schedule.platform.example
      description: Облачное расписание; все вузы обслуживает один процесс этого типа.
    get:
      tags:
      - Schedule events
      operationId: listScheduleEvents
      summary: Расписание за период
      description: 'Попадание: starts_at < to AND ends_at > from. Интервал до 31 суток; порядок (starts_at,id) ASC.
        Включая отменённые занятия. Фильтры только сужают разрешённый набор; для чужого фильтра пустой список, не
        расширение доступа.'
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      x-authorization: online-introspection
      x-access-rules:
      - 'student: только своя текущая группа и её занятия.'
      - 'teacher: названия групп вуза; занятия только с собственным sub в teacher_ids.'
      - 'admin AND schedule.read_all: все группы и занятия экземпляра.'
      parameters:
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/GroupFilter'
      - $ref: '#/components/parameters/TeacherFilter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      tags:
      - Schedule events
      operationId: createScheduleEvent
      summary: Создать занятие
      description: ''
      responses:
        '201':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
        '409':
          $ref: '#/components/responses/Error409'
      x-authorization: online-introspection
      x-access-rules:
      - admin AND schedule.write.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
  /api/v1/schedule/events/{event_id}:
    servers:
    - url: https://schedule.platform.example
      description: Облачное расписание; все вузы обслуживает один процесс этого типа.
    get:
      tags:
      - Schedule events
      operationId: getScheduleEvent
      summary: Прочитать занятие
      description: Вне собственного расписания — 404.
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      x-authorization: online-introspection
      x-access-rules:
      - 'student: только своя текущая группа и её занятия.'
      - 'teacher: названия групп вуза; занятия только с собственным sub в teacher_ids.'
      - 'admin AND schedule.read_all: все группы и занятия экземпляра.'
      parameters:
      - $ref: '#/components/parameters/event_id'
    put:
      tags:
      - Schedule events
      operationId: replaceScheduleEvent
      summary: Изменить или отменить занятие
      description: ''
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
      x-authorization: online-introspection
      x-access-rules:
      - admin AND schedule.write.
      parameters:
      - $ref: '#/components/parameters/event_id'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
    delete:
      tags:
      - Schedule events
      operationId: deleteScheduleEvent
      summary: Удалить ошибочно созданное занятие
      description: Для обычной отмены использовать PUT status=cancelled; DELETE — удаление из выдачи с записью аудита.
      responses:
        '204':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
      x-authorization: online-introspection
      x-access-rules:
      - admin AND schedule.write.
      parameters:
      - $ref: '#/components/parameters/event_id'
      - $ref: '#/components/parameters/IfMatch'
  /schedule:
    servers:
    - url: https://schedule.platform.example
      description: Облачное расписание; все вузы обслуживает один процесс этого типа.
    get:
      tags:
      - Client
      operationId: getScheduleClient
      summary: Загрузить HTML клиента сервиса
      description: Статическая оболочка без токенов, персональных данных и tenant. После iframe-handshake получает
        service access и вызывает API. Не является доказательством доступа.
      responses:
        '200':
          description: HTML-оболочка.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/html:
              schema:
                type: string
      security: []
  /api/v1/schedule/widgets/today:
    servers:
    - url: https://schedule.platform.example
    get:
      tags:
      - Home widgets
      operationId: getScheduleWidgetToday
      summary: Виджет «Сегодня»
      description: 'Студент — занятия своей группы, преподаватель — свои; сегодня или ближайший учебный день в пределах недели (часовой пояс вуза). Администратору — 403.'
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetData'
        '204':
          description: Показывать нечего — карточка скрыта.
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      security:
      - ServiceBearer: []
  /api/v1/schedule/widgets/today-admin:
    servers:
    - url: https://schedule.platform.example
    get:
      tags:
      - Home widgets
      operationId: getScheduleWidgetTodayAdmin
      summary: Виджет «Занятия сегодня»
      description: 'Число занятий сегодня в вузе и отменённых; admin с schedule.read_all.'
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetData'
        '204':
          description: Показывать нечего — карточка скрыта.
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      security:
      - ServiceBearer: []
components:
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT service_access
      description: 'Только JWT ядра: aud=service:{service_id}, token_use=service_access. Ни core, ни machine, ни
        refresh. Контекст уточняется introspection своего экземпляра.'
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: Непрозрачный keyset cursor на 15 минут; связан с actor, фильтрами и областью доступа.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 128
        pattern: ^"[^"\\]+"$
      description: Ровно один strong ETag текущего ресурса. Нет заголовка — 428; несовпадение — 412. * запрещён.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
      description: Повтор создания с тем же ключом/телом в течение 24 ч возвращает прежний результат. Иное тело
        — 409.
    group_id:
      name: group_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
      description: ''
    event_id:
      name: event_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
      description: ''
    From:
      name: from
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/DateTime'
      description: Начало полуоткрытого интервала [from,to), UTC Z; не более 31 суток.
    To:
      name: to
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/DateTime'
      description: Конец интервала, строго позже from.
    GroupFilter:
      name: group_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UUID'
      description: Дополнительное сужение; не расширяет доступ по профилю.
    TeacherFilter:
      name: teacher_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UUID'
      description: Дополнительное сужение; не расширяет доступ по профилю.
  headers:
    RequestId:
      description: UUID запроса, назначенный ядром.
      schema:
        $ref: '#/components/schemas/UUID'
    NoStore:
      description: Ответ нельзя сохранять в HTTP-кэше.
      schema:
        type: string
        const: no-store
    ETag:
      description: Strong ETag ресурса для If-Match.
      schema:
        type: string
        examples:
        - '"rev-7"'
    Location:
      description: Относительный URI созданного ресурса ядра.
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Число секунд до следующей попытки.
      schema:
        type: integer
        minimum: 1
    Authenticate:
      description: Basic на machine token exchange; Bearer на access-защищённых маршрутах. На body-refresh может
        отсутствовать.
      schema:
        type: string
        examples:
        - Bearer
        - Basic realm="core-service"
  responses:
    Error400:
      description: Невалидный JSON, cursor или синтаксис запроса.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error401:
      description: Аутентификация отсутствует или недействительна; invalid_init_data/refresh/client также дают 401.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        WWW-Authenticate:
          $ref: '#/components/headers/Authenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: Не хватает профиля, scope или актуального permission; защищённая операция запрещена.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: Ресурс не существует либо находится вне области доступа. Public private-prefix всегда 404.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error409:
      description: Конфликт состояния, защищённого инварианта, уникальности или Idempotency-Key.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error412:
      description: Переданный If-Match больше не соответствует версии ресурса.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error422:
      description: Ошибка схемы или доменной валидации; см. error.details.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error428:
      description: Обязательный If-Match отсутствует.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error429:
      description: Превышен лимит запросов.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error503:
      description: Необходимое хранилище или конфигурация недоступны. Повтор не означает гарантированный успех.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error500:
      description: Внутренняя ошибка без раскрытия реализации.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    WidgetTone:
      type: string
      enum: [normal, muted, accent, warning, danger]
    WidgetData:
      description: Данные виджета главного экрана по шаблону kind (docs/services/sdk/WIDGETS_SPEC.md §7). Тело до 16 KB; 204 — карточку не показывать.
      oneOf:
      - type: object
        additionalProperties: false
        required: [kind, user_id, title, lines]
        properties:
          kind: {const: profile}
          user_id: {$ref: '#/components/schemas/UUID'}
          title: {type: string, maxLength: 120}
          lines: {type: array, maxItems: 3, items: {type: string, maxLength: 80}}
          progress: {type: integer, minimum: 0, maximum: 100}
          hint: {type: string, maxLength: 80}
      - type: object
        additionalProperties: false
        required: [kind, day, items]
        properties:
          kind: {const: events}
          day: {type: [string, 'null'], format: date}
          items:
            type: array
            maxItems: 10
            items:
              type: object
              additionalProperties: false
              required: [title, starts_at, ends_at, status]
              properties:
                title: {type: string, maxLength: 120}
                starts_at: {type: string, format: date-time}
                ends_at: {type: string, format: date-time}
                place: {type: string, maxLength: 80}
                status: {type: string, enum: [scheduled, cancelled]}
          empty_text: {type: string, maxLength: 300}
      - type: object
        additionalProperties: false
        required: [kind, items]
        properties:
          kind: {const: list}
          items:
            type: array
            maxItems: 5
            items:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: {type: string, maxLength: 120}
                subtitle: {type: string, maxLength: 80}
                badge: {type: string, maxLength: 80}
                tone: {$ref: '#/components/schemas/WidgetTone'}
          total: {type: integer, minimum: 0}
          empty_text: {type: string, maxLength: 300}
      - type: object
        additionalProperties: false
        required: [kind, value]
        properties:
          kind: {const: stat}
          value: {type: number}
          unit: {type: string, maxLength: 80}
          caption: {type: string, maxLength: 80}
          tone: {$ref: '#/components/schemas/WidgetTone'}
      - type: object
        additionalProperties: false
        required: [kind, value]
        properties:
          kind: {const: progress}
          value: {type: integer, minimum: 0, maximum: 100}
          caption: {type: string, maxLength: 80}
          hint: {type: string, maxLength: 80}
      - type: object
        additionalProperties: false
        required: [kind, title]
        properties:
          kind: {const: notice}
          title: {type: string, maxLength: 120}
          text: {type: string, maxLength: 300}
          tone: {$ref: '#/components/schemas/WidgetTone'}
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
              enum:
              - BAD_REQUEST
              - INVALID_CURSOR
              - INVALID_INIT_DATA
              - INVALID_REFRESH_TOKEN
              - INVALID_CLIENT
              - UNAUTHENTICATED
              - FORBIDDEN
              - PROTECTED_RESOURCE
              - RESOURCE_NOT_FOUND
              - RESOURCE_INACTIVE
              - MEMBERSHIP_ALREADY_EXISTS
              - SERVICE_ALREADY_EXISTS
              - ROLE_ALREADY_EXISTS
              - ROLE_IN_USE
              - LAST_OWNER
              - MANIFEST_REQUIRED
              - CREDENTIAL_LIMIT
              - IDEMPOTENCY_CONFLICT
              - PRECONDITION_FAILED
              - PRECONDITION_REQUIRED
              - VALIDATION_ERROR
              - INVALID_ROLE_ASSIGNMENT
              - RATE_LIMITED
              - SERVICE_UNAVAILABLE
              - INTERNAL_ERROR
              - INSTANCE_NOT_READY
              - GROUP_ALREADY_EXISTS
              - GROUP_IN_USE
              - STUDENT_ALREADY_GROUPED
              - INVALID_REFERENCE
              - INVALID_TIME_RANGE
              - INVALID_STATE
              - PAYLOAD_TOO_LARGE
              - UNSUPPORTED_MEDIA_TYPE
              - FILE_STORAGE_UNAVAILABLE
            message:
              type: string
              maxLength: 500
            request_id:
              $ref: '#/components/schemas/UUID'
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
              maxItems: 100
      examples:
      - error:
          code: RESOURCE_NOT_FOUND
          message: Ресурс не найден
          request_id: 7de86629-e295-46c1-85c1-d0322ec97d3a
    GroupInput:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    Group:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
          minLength: 1
          maxLength: 100
    GroupStudentsInput:
      type: object
      additionalProperties: false
      required:
      - user_ids
      properties:
        user_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 0
          maxItems: 500
          uniqueItems: true
    GroupStudents:
      type: object
      additionalProperties: false
      required:
      - group_id
      - user_ids
      properties:
        group_id:
          $ref: '#/components/schemas/UUID'
        user_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 0
          maxItems: 500
          uniqueItems: true
    EventInput:
      type: object
      additionalProperties: false
      required:
      - title
      - starts_at
      - ends_at
      - group_ids
      - teacher_ids
      - location
      - description
      - status
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        starts_at:
          $ref: '#/components/schemas/DateTime'
        ends_at:
          $ref: '#/components/schemas/DateTime'
        group_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 1
          maxItems: 50
          uniqueItems: true
        teacher_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 1
          maxItems: 10
          uniqueItems: true
        location:
          type: string
          minLength: 0
          maxLength: 200
        description:
          type: string
          minLength: 0
          maxLength: 2000
        status:
          type: string
          enum:
          - scheduled
          - cancelled
      description: Одно конкретное занятие без recurrence. starts_at < ends_at. Связанные группы и действующие teacher
        — в данном вузе/экземпляре. Все поля обязательны при POST/PUT.
      examples:
      - title: Математический анализ
        starts_at: '2026-09-28T06:00:00Z'
        ends_at: '2026-09-28T07:30:00Z'
        group_ids:
        - 30c417e5-983e-4d1f-bdd0-ae1fd7ff5e80
        teacher_ids:
        - a76e24db-05e7-4cde-8a60-fbe3b5e5dd42
        location: Аудитория 205
        description: ''
        status: scheduled
    Event:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - starts_at
      - ends_at
      - group_ids
      - teacher_ids
      - location
      - description
      - status
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
          minLength: 1
          maxLength: 200
        starts_at:
          $ref: '#/components/schemas/DateTime'
        ends_at:
          $ref: '#/components/schemas/DateTime'
        group_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 1
          maxItems: 50
          uniqueItems: true
        teacher_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 1
          maxItems: 10
          uniqueItems: true
        location:
          type: string
          minLength: 0
          maxLength: 200
        description:
          type: string
          minLength: 0
          maxLength: 2000
        status:
          type: string
          enum:
          - scheduled
          - cancelled
    GroupPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Group'
          minItems: 0
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
    EventPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          minItems: 0
          maxItems: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
    UUID:
      type: string
      format: uuid
      examples:
      - 46bf3278-29fa-4d0a-a711-e4a6a324ed31
    DateTime:
      type: string
      format: date-time
      description: RFC 3339 UTC, суффикс Z.
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - path
      - message
      properties:
        path:
          type: string
          maxLength: 256
        message:
          type: string
          maxLength: 500
      description: path — JSON Pointer либо имя параметра. В message не отражаются входные секреты.
