services:
  bot:
    build: ./bot
    restart: unless-stopped
    init: true
    env_file:
      - .env

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web/templates:/usr/share/nginx/html:ro
      - ./web/configs/docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/lib/max-miniapp/acme:/var/www/acme:ro
      - /var/lib/max-miniapp/letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - /var/lib/max-miniapp/acme:/var/www/acme
      - /var/lib/max-miniapp/letsencrypt:/etc/letsencrypt
