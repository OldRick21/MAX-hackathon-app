services:
  bot:
    build: ./bot
    restart: unless-stopped
    init: true
    env_file:
      - .env

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./web/templates:/usr/share/nginx/html:ro
      - ./web/configs/docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
