services:
  bot:
    build: ./bot
    restart: unless-stopped
    init: true
    env_file:
      - .env

  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/core-jwt.db
      USER_PROFILE_PROVISIONING_TOKEN: ${USER_PROFILE_PROVISIONING_TOKEN:?Set USER_PROFILE_PROVISIONING_TOKEN in .env}
      USER_PROFILE_API_BASE_URL: ${SHELL_ORIGIN}/people/api/v1
      USER_PROFILE_CLIENT_BASE_URL: ${SHELL_ORIGIN}
      SCHEDULE_PROVISIONING_TOKEN: ${SCHEDULE_PROVISIONING_TOKEN:?Set SCHEDULE_PROVISIONING_TOKEN in .env}
      SCHEDULE_API_BASE_URL: ${SHELL_ORIGIN}/schedule/api/v1
      SCHEDULE_CLIENT_BASE_URL: ${SHELL_ORIGIN}
      SERVICE_CONFIG_DIR: /srv/services/connected
      CURSOR_SECRET_KEY: ${CURSOR_SECRET_KEY:?Set CURSOR_SECRET_KEY in .env}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in .env}
      JWT_KEYRING_PATH: /data/jwt/keys.json
      MAX_BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      CLOUD_BINDING_KEY: ${CLOUD_BINDING_KEY:?Set CLOUD_BINDING_KEY in .env}
      ADMINISTRATION_PROVISIONING_TOKEN: ${ADMINISTRATION_PROVISIONING_TOKEN:?Set ADMINISTRATION_PROVISIONING_TOKEN in .env}
      ADMINISTRATION_API_BASE_URL: ${ADMINISTRATION_PUBLIC_ORIGIN:?Set ADMINISTRATION_PUBLIC_ORIGIN in .env}/api/v1
      ADMINISTRATION_CLIENT_BASE_URL: ${ADMINISTRATION_PUBLIC_ORIGIN}
      REDIS_HOST: redis
      ALLOW_DEV_LOGIN: "false"
      SEED_DEMO_DATA: "false"
      ALLOW_FAKE_REDIS: "false"
    volumes:
      - core-data:/data
      - ./services/connected:/srv/services/connected
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Облачный сервис «Администрирование»: один процесс на все вузы.
  # Только он обращается к private API ядра (http://backend:8000/api/v1/institution/*/internal).
  administration:
    build: ./services/administration
    environment:
      CORE_INTERNAL_URL: http://backend:8000
      ADMINISTRATION_PROVISIONING_TOKEN: ${ADMINISTRATION_PROVISIONING_TOKEN}
      ADMINISTRATION_API_BASE_URL: ${ADMINISTRATION_PUBLIC_ORIGIN}/api/v1
      SHELL_ORIGIN: ${SHELL_ORIGIN:?Set SHELL_ORIGIN in .env}
      FRAME_ANCESTORS: https://web.max.ru
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true

  user-profile:
    build: ./services/user-profile
    restart: unless-stopped
    init: true
    environment:
      CORE_INTERNAL_URL: http://backend:8000
      USER_PROFILE_PROVISIONING_TOKEN: ${USER_PROFILE_PROVISIONING_TOKEN}
      PROFILE_DB: /data/profiles.db
    volumes:
      - profile-data:/data
    depends_on:
      backend:
        condition: service_healthy

  # Облачный сервис расписания: группы и занятия всех вузов, своя SQLite.
  schedule:
    build: ./services/schedule
    restart: unless-stopped
    init: true
    environment:
      CORE_INTERNAL_URL: http://backend:8000
      SCHEDULE_PROVISIONING_TOKEN: ${SCHEDULE_PROVISIONING_TOKEN}
      SCHEDULE_DB: /data/schedule.db
    volumes:
      - schedule-data:/data
    depends_on:
      backend:
        condition: service_healthy

  web:
    depends_on:
      backend:
        condition: service_healthy
      administration:
        condition: service_healthy
      user-profile:
        condition: service_healthy
      schedule:
        condition: service_healthy
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
      - "8444:8444"
    volumes:
      - ./services/demo-service:/srv/demo-service:ro
      - ./web/configs/docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/lib/max-miniapp/acme:/var/www/acme:ro
      - /var/lib/max-miniapp/letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - /var/lib/max-miniapp/acme:/var/www/acme
      - /var/lib/max-miniapp/letsencrypt:/etc/letsencrypt

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  schedule-data:
  profile-data:
  core-data:
  redis-data:
