services:
  bot:
    build: ./bot
    restart: unless-stopped
    init: true
    env_file:
      - .env

  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/core.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      MAX_BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      REDIS_HOST: redis
      ALLOW_DEV_LOGIN: "false"
      SEED_DEMO_DATA: "false"
      ALLOW_FAKE_REDIS: "false"
    volumes:
      - core-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    depends_on:
      backend:
        condition: service_healthy
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./frontend:/srv/frontend:ro
      - ./demo-service:/srv/demo-service:ro
      - ./web/configs/docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/lib/max-miniapp/acme:/var/www/acme:ro
      - /var/lib/max-miniapp/letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - /var/lib/max-miniapp/acme:/var/www/acme
      - /var/lib/max-miniapp/letsencrypt:/etc/letsencrypt

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  core-data:
  redis-data:
