services:
  bot:
    build: ./bot
    restart: unless-stopped
    init: true
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      BOT_CORE_TOKEN: ${BOT_CORE_TOKEN:?Set BOT_CORE_TOKEN in .env}
      CORE_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    environment: &core-env
      DATABASE_URL: sqlite:////data/core-jwt.db
      SERVICE_CONFIG_DIR: /srv/services/connected
      CURSOR_SECRET_KEY: ${CURSOR_SECRET_KEY:?Set CURSOR_SECRET_KEY in .env}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in .env}
      JWT_KEYRING_PATH: /data/jwt/keys.json
      MAX_BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      BOT_CORE_TOKEN: ${BOT_CORE_TOKEN:?Set BOT_CORE_TOKEN in .env}
      # Облачные сервисы: ключ вывода секретов, токены раннеров, публичные адреса.
      CLOUD_BINDING_KEY: ${CLOUD_BINDING_KEY:?Set CLOUD_BINDING_KEY in .env}
      ADMINISTRATION_PROVISIONING_TOKEN: ${ADMINISTRATION_PROVISIONING_TOKEN:?Set ADMINISTRATION_PROVISIONING_TOKEN in .env}
      SCHEDULE_PROVISIONING_TOKEN: ${SCHEDULE_PROVISIONING_TOKEN:?Set SCHEDULE_PROVISIONING_TOKEN in .env}
      USER_PROFILE_PROVISIONING_TOKEN: ${USER_PROFILE_PROVISIONING_TOKEN:?Set USER_PROFILE_PROVISIONING_TOKEN in .env}
      SHELL_ORIGIN: ${SHELL_ORIGIN:?Set SHELL_ORIGIN in .env}
      ADMINISTRATION_PUBLIC_ORIGIN: ${ADMINISTRATION_PUBLIC_ORIGIN:?Set ADMINISTRATION_PUBLIC_ORIGIN in .env}
      REDIS_HOST: redis
      # Лимиты запросов в минуту (CORE_API_SPEC.md §3); 0 — без лимита.
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10}
      RATE_LIMIT_REFRESH: ${RATE_LIMIT_REFRESH:-30}
      RATE_LIMIT_MACHINE_EXCHANGE: ${RATE_LIMIT_MACHINE_EXCHANGE:-30}
      RATE_LIMIT_USER: ${RATE_LIMIT_USER:-120}
      RATE_LIMIT_CREDENTIAL: ${RATE_LIMIT_CREDENTIAL:-600}
      ALLOW_DEV_LOGIN: "false"
      SEED_DEMO_DATA: "false"
      ALLOW_FAKE_REDIS: "false"
    volumes:
      - core-data:/data
      - ./services/connected:/srv/services/connected
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Пульт оператора платформы: тот же образ и та же БД, что у ядра.
  # Снаружи — https://<сервер>:8445 через Nginx (вход по OPERATOR_PASSWORD);
  # на самом сервере и через SSH-туннель — http://127.0.0.1:8500.
  operator:
    build: ./backend
    command: ["uvicorn", "operator_panel.app:app", "--host", "0.0.0.0", "--port", "8500", "--workers", "1"]
    environment:
      <<: *core-env
      # Пульт не является ботом и не получает его внутренний секрет.
      BOT_CORE_TOKEN: ""
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?Set OPERATOR_PASSWORD in .env}
    volumes:
      - core-data:/data
      # Необязательные модули пульта (например, test-data/operator-demo); наполняет scripts/deploy.sh.
      - operator-plugins:/srv/plugins:ro
      - ./services/connected:/srv/services/connected
    ports:
      - "127.0.0.1:8500:8500"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8500/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Облачные сервисы: раннер на тип, внутри — отдельный процесс для каждого вуза (services/runner).
  # Экземпляры и их ключи раннер получает у ядра своим токеном; данные вузов — в /data/<service_id>.
  administration:
    build: {context: ./services, dockerfile: administration/Dockerfile}
    environment:
      PROVISIONING_TOKEN: ${ADMINISTRATION_PROVISIONING_TOKEN}
      SHELL_ORIGIN: ${SHELL_ORIGIN}
      CORE_INTERNAL_URL: http://backend:8000
      FRAME_ANCESTORS: https://web.max.ru
      PASS_ENV: FRAME_ANCESTORS
    volumes:
      - administration-data:/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true

  schedule:
    build: {context: ./services, dockerfile: schedule/Dockerfile}
    environment:
      PROVISIONING_TOKEN: ${SCHEDULE_PROVISIONING_TOKEN}
      SHELL_ORIGIN: ${SHELL_ORIGIN}
      CORE_INTERNAL_URL: http://backend:8000
    volumes:
      - schedule-data:/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true

  user-profile:
    build: {context: ./services, dockerfile: user-profile/Dockerfile}
    environment:
      PROVISIONING_TOKEN: ${USER_PROFILE_PROVISIONING_TOKEN}
      SHELL_ORIGIN: ${SHELL_ORIGIN}
      CORE_INTERNAL_URL: http://backend:8000
    volumes:
      - profile-data:/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true

  # Курсовые и свои сервисы вуза — локальные: свой сервер вуза (test-data/coursework).

  web:
    depends_on:
      backend:
        condition: service_healthy
      administration:
        condition: service_healthy
      schedule:
        condition: service_healthy
      user-profile:
        condition: service_healthy
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8444:8444"
      - "8445:8445"
    volumes:
      - ./web/configs/docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/lib/max-miniapp/acme:/var/www/acme:ro
      - /var/lib/max-miniapp/letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - /var/lib/max-miniapp/acme:/var/www/acme
      - /var/lib/max-miniapp/letsencrypt:/etc/letsencrypt

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  core-data:
  operator-plugins:
  administration-data:
  schedule-data:
  profile-data:
  redis-data:
