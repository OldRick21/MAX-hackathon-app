# Local MAX-less deployment. TLS is self-signed and all published ports are bound to loopback.
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/maxless/localhost.crt;
    ssl_certificate_key /etc/nginx/maxless/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/frontend;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(applications|join)$ {
        rewrite ^ /index.html last;
    }

    location = /institution {
        rewrite ^ /index.html last;
    }

    location ~ "^/institution/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:/.*)?$" {
        rewrite ^ /index.html last;
    }

    location /assets/ {
        add_header Cache-Control "no-cache" always;
        root /srv/frontend;
        try_files $uri =404;
    }

    location ~ ^/api/v1/internal/(auth/(token|jwks|introspect)$|service(/|$)|privacy(/|$)) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/api/v1/institution/[^/]+/internal(?:/|$) {
        return 404;
    }

    location ~ ^/api/v1/internal(?:/|$) {
        return 404;
    }

    location /schedule/ {
        client_max_body_size 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $schedule schedule:8000;
        rewrite ^/schedule(/.*)$ $1 break;
        proxy_pass http://$schedule;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /people/ {
        client_max_body_size 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $people user-profile:8000;
        rewrite ^/people(/.*)$ $1 break;
        proxy_pass http://$people;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /index.html {
        auth_request /_shell_csp;
        auth_request_set $shell_csp $upstream_http_content_security_policy;
        add_header Content-Security-Policy $shell_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        etag off;
        if_modified_since off;
    }

    location = /_shell_csp {
        internal;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend:8000;
        proxy_pass http://$backend/api/v1/internal/shell-csp;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
}

server {
    listen 8444 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/maxless/localhost.crt;
    ssl_certificate_key /etc/nginx/maxless/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    location ~ "^/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/" {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $administration administration:8000;
        proxy_pass http://$administration;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
    }

    location / {
        return 404;
    }
}
