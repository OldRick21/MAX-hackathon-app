server {
    listen 80;
    server_name 195.133.197.144;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://195.133.197.144$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 195.133.197.144;

    ssl_certificate /etc/letsencrypt/live/max-miniapp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max-miniapp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/frontend/templates;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # Публичные HTML-оболочки; членство проверяется только JSON API.
    location = /institution {
        rewrite ^ /index.html last;
    }

    location ~ "^/institution/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" {
        rewrite ^ /index.html last;
    }

    location /static/ {
        add_header Cache-Control "no-cache" always;
        root /srv/frontend;
        try_files $uri =404;
    }

    # Public machine endpoints and public access-key discovery.
    location ~ ^/api/v1/internal/(auth/(token|jwks|introspect)$|service(/|$)) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Private institution administration and provisioning remain internal.
    location ~ ^/api/v1/(internal(?:/|$)|institution/[^/]+/internal(?:/|$)) {
        return 404;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        etag off;
        if_modified_since off;
    }
}

# Demo service uses a separate origin (port 8443); no core API is exposed here.
server {
    listen 8443 ssl;
    server_name 195.133.197.144;
    ssl_certificate /etc/letsencrypt/live/max-miniapp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max-miniapp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/demo-service;
    index index.html;
    charset utf-8;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "frame-ancestors https://195.133.197.144 https://web.max.ru" always;
    location / { try_files $uri $uri/ =404; }
}

# Сервис «Администрирование»: отдельный origin (порт 8444) для iframe и его API.
# Private API ядра отсюда недоступен: проксируется только процесс administration.
server {
    listen 8444 ssl;
    server_name 195.133.197.144;
    ssl_certificate /etc/letsencrypt/live/max-miniapp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max-miniapp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    location ~ ^/(admin|assets/|api/v1/(health|service|administration)(/|$)) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $administration administration:8100;
        proxy_pass http://$administration;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location / { return 404; }
}
