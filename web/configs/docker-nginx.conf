server {
    listen 80;
    server_name 195.133.197.144;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://195.133.197.144$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 195.133.197.144;

    ssl_certificate /etc/letsencrypt/live/max-miniapp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max-miniapp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/frontend/templates;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location /static/ {
        root /srv/frontend;
        try_files $uri =404;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
