server {
    listen 80;
    server_name 195.133.197.144;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://195.133.197.144$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 195.133.197.144;

    ssl_certificate /etc/letsencrypt/live/max-miniapp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max-miniapp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
