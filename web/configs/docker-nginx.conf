server {
    listen 80;
    server_name 195.133.197.144;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://195.133.197.144$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 195.133.197.144;

    ssl_certificate /etc/letsencrypt/live/max-miniapp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max-miniapp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/frontend;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # Публичные HTML-оболочки; членство проверяется только JSON API.
    location ~ ^/(applications|join)$ {
        rewrite ^ /index.html last;
    }

    location = /institution {
        rewrite ^ /index.html last;
    }

    location ~ "^/institution/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:/.*)?$" {
        rewrite ^ /index.html last;
    }

    location /assets/ {
        add_header Cache-Control "no-cache" always;
        root /srv/frontend;
        try_files $uri =404;
    }

    # Public machine endpoints and public access-key discovery.
    location ~ ^/api/v1/internal/(auth/(token|jwks|introspect)$|service(/|$)|privacy(/|$)) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Private API вуза не публикуется: раннер администрирования ходит в ядро по внутренней сети
    # (http://backend:8000). Снаружи — 404 на любой метод (CORE_API_SPEC.md §2.2).
    location ~ ^/api/v1/institution/[^/]+/internal(?:/|$) {
        return 404;
    }

    # В том числе bot/group-chats/resolve: бот обращается к нему только как контейнер
    # по http://backend:8000 с отдельным BOT_CORE_TOKEN.
    # Остальное служебное ядра наружу не открыто.
    location ~ ^/api/v1/internal(?:/|$) {
        return 404;
    }

    # Облачные расписание и «Люди»: /schedule/<service_id>/… и /people/<service_id>/… — в раннер типа,
    # он передаёт запрос процессу этого вуза. Экраны рисует оболочка, поэтому origin общий.
    # Импорт расписания: тело — сам файл, сервис принимает до 2 МБ (importer.MAX_BYTES).
    # Запас сверх 2 МБ — чтобы о размере ответил сервис понятной ошибкой, а не nginx.
    location ~ ^/schedule/[0-9a-f-]+/api/v1/schedule/import$ {
        client_max_body_size 3m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $schedule schedule:8000;
        rewrite ^/schedule(/.*)$ $1 break;
        proxy_pass http://$schedule;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /schedule/ {
        client_max_body_size 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $schedule schedule:8000;
        rewrite ^/schedule(/.*)$ $1 break;
        proxy_pass http://$schedule;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /people/ {
        client_max_body_size 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $people user-profile:8000;
        rewrite ^/people(/.*)$ $1 break;
        proxy_pass http://$people;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CSP оболочки: frame-src — только зарегистрированные client origins; список даёт ядро.
    location = /index.html {
        auth_request /_shell_csp;
        auth_request_set $shell_csp $upstream_http_content_security_policy;
        add_header Content-Security-Policy $shell_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        etag off;
        if_modified_since off;
    }

    location = /_shell_csp {
        internal;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend:8000;
        proxy_pass http://$backend/api/v1/internal/shell-csp;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
}

# Облачное администрирование: отдельный origin для iframe, путь /<service_id>/… — процесс вуза в раннере.
server {
    listen 8444 ssl;
    server_name 195.133.197.144;
    ssl_certificate /etc/letsencrypt/live/max-miniapp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max-miniapp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    location ~ "^/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/" {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $administration administration:8000;
        proxy_pass http://$administration;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location / { return 404; }
}

# Пульт оператора платформы: отдельный порт, свой пароль, в iframe не встраивается.
# Доступ можно сузить до своих IP строками allow/deny внутри location.
server {
    listen 8445 ssl;
    server_name 195.133.197.144;
    ssl_certificate /etc/letsencrypt/live/max-miniapp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max-miniapp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $operator operator:8500;
        proxy_pass http://$operator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
