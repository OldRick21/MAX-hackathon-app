<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Приветствие — мини-приложение</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%235b48e8'/%3E%3Cpath d='M8 17l5 5 11-12' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <script src="https://st.max.ru/js/max-web-app.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font: 1rem/1.6 system-ui, sans-serif; background: #f5f4fb; color: #242138; }
    main { width: 100%; max-width: 460px; padding: clamp(24px, 6vw, 40px); background: #fff; border: 1px solid #e7e3f4; border-radius: 24px; }
    .mark { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 18px; background: #5b48e8; color: white; font-size: 28px; }
    h1 { margin: 24px 0 12px; font-size: clamp(1.8rem, 7vw, 2.5rem); line-height: 1.2; overflow-wrap: anywhere; }
    p { margin: 0; color: #605b74; }
    @media (prefers-color-scheme: dark) {
      body { background: #151320; color: #f4f2ff; }
      main { background: #211e30; border-color: #383249; }
      p { color: #c1bcd2; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <h1 id="greeting">Привет!</h1>
    <p id="status" role="status">Подключаемся к MAX…</p>
    <noscript>Для работы мини-приложения включи JavaScript.</noscript>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const app = window.WebApp;
      const greeting = document.getElementById('greeting');
      const status = document.getElementById('status');
      if (!app) {
        status.textContent = 'Не удалось загрузить MAX Bridge. Проверь интернет и открой приложение снова.';
        return;
      }
      if (!app.initData) {
        status.textContent = 'Открой мини-приложение через кнопку в чате с ботом MAX — здесь появится твоё имя.';
        return;
      }
      // Только отображение. Для авторизации нужна серверная проверка initData.
      const name = app.initDataUnsafe?.user?.first_name;
      if (typeof name === 'string' && name.trim()) {
        greeting.textContent = `Привет, ${name.trim()}!`;
        status.textContent = 'Рады видеть тебя в мини-приложении.';
      } else {
        status.textContent = 'Приложение открыто в MAX, но имя не передано. Попробуй открыть его заново через бота.';
      }
    });
  </script>
</body>
</html>
